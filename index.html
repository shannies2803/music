<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cadenza Ear Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#edf1ee; --paper:#ffffff; --paper2:#f6f8f6; --ink:#16201e; --fg:#16201e; --muted:#55625e; --line:#cbd5d1;
  --brass:#9a6a10; --brass-strong:#b37d15; --brass-soft:#f3e4c0; --teal:#0f6b65; --teal-soft:#d2e9e5;
  --rose:#b0324f; --rose-soft:#f7dae1; --ok:#2b7a2f; --ok-soft:#d9eed9; --stave:#24302d; --onaccent:#ffffff;
  --shadow:0 1px 0 rgba(20,30,28,.06),0 6px 18px rgba(20,30,28,.07); --keyw:#fbfcfb; --keyb:#1d2624;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1514; --paper:#18201f; --paper2:#1d2725; --ink:#e6edea; --fg:#e6edea; --muted:#9eb0aa; --line:#2e3c39;
  --brass:#e3b452; --brass-strong:#e3b452; --brass-soft:#3a2e14; --teal:#5cc6b9; --teal-soft:#123230;
  --rose:#f2809c; --rose-soft:#3c1823; --ok:#82d185; --ok-soft:#163018; --stave:#dfe8e5; --onaccent:#0f1514;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); --keyw:#26302e; --keyb:#0a0f0e;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f1514; --paper:#18201f; --paper2:#1d2725; --ink:#e6edea; --fg:#e6edea; --muted:#9eb0aa; --line:#2e3c39;
  --brass:#e3b452; --brass-strong:#e3b452; --brass-soft:#3a2e14; --teal:#5cc6b9; --teal-soft:#123230;
  --rose:#f2809c; --rose-soft:#3c1823; --ok:#82d185; --ok-soft:#163018; --stave:#dfe8e5; --onaccent:#0f1514;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); --keyw:#26302e; --keyb:#0a0f0e;
  color-scheme:dark; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Avenir Next","Trebuchet MS",system-ui,sans-serif;letter-spacing:-.01em;line-height:1.15}
h2{font-size:1.6rem;margin:.2em 0 .3em} h3{font-size:1.15rem;margin:.2em 0 .4em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass-strong);outline-offset:2px;border-radius:8px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:10px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand svg{flex:none}
.brand b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.1}
.players{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pchip{min-height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700;display:flex;align-items:center;gap:6px}
.pchip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--ink)}
.pchip .xp{font-weight:400;font-size:.8rem;color:var(--muted)}
.iconbtn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer;display:inline-grid;place-items:center}
nav.tabs{display:flex;width:100%;gap:0;margin-top:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-height:50px;border:0;background:transparent;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:4px solid transparent;padding:0 8px;white-space:nowrap;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.02rem}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass-strong)}
/* generic */
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:2px solid var(--ink);background:var(--paper);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--onaccent)}
.btn.brass{background:var(--brass-strong);border-color:var(--brass-strong);color:var(--onaccent)}
.btn.ghost{border-color:var(--line)}
.btn.small{min-height:44px;padding:0 12px;font-size:.92rem;border-width:1px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin:18px 0}
.hero > *{min-width:0}
.kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--brass);font-weight:700}
.goal{display:flex;gap:14px;align-items:center}
.ring{flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;background:var(--brass-soft);color:var(--ink);font-size:.82rem;font-weight:700}
.pill.t{background:var(--teal-soft)}
.stars{color:var(--brass-strong);letter-spacing:1px;font-size:1rem;white-space:nowrap}
.stars .off{color:var(--line)}
/* skill list: rows on a stave */
.skilllist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
.skill{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;text-align:left;min-height:72px;width:100%}
.skill:hover{background:var(--paper2)}
.skill .no{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.5rem;color:var(--brass);text-align:center;line-height:1}
.skill .no small{display:block;font-size:.62rem;letter-spacing:.1em;color:var(--muted);font-weight:600}
.skill .nm{font-weight:700;font-size:1.05rem}
.skill .ds{color:var(--muted);font-size:.88rem;line-height:1.3}
.skill > div{min-width:0}
.meter{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px;max-width:220px}
.meter i{display:block;height:100%;background:var(--teal)}
/* levels */
.levels{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.lvl{min-width:84px;min-height:64px;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:pointer;padding:6px 8px;text-align:left;display:flex;flex-direction:column;justify-content:center}
.lvl b{font-size:.95rem}
.lvl[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.lvl:disabled{cursor:not-allowed;opacity:.55}
.lvl .lk{font-size:.75rem;color:var(--muted)}
/* exercise */
.ex{margin-top:16px}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--rose)} .dots i.cur{outline:2px solid var(--ink);outline-offset:1px}
.prompt{font-size:1.18rem;font-weight:700;margin:14px 0 8px}
.playbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.playbtn{min-height:56px;padding:0 20px;border-radius:30px;border:0;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:10px}
.playbtn.alt{background:var(--paper2);color:var(--ink);border:1px solid var(--line)}
.playbtn svg{flex:none}
.playbtn.playing{background:var(--brass-strong);color:var(--onaccent)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.opt{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700;padding:8px 12px;text-align:center;line-height:1.25}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--rose);background:var(--rose-soft)}
.opt:disabled{cursor:default}
.opt.svgopt{padding:4px}
.opt.svgopt svg{width:100%;height:auto;max-width:200px}
.feedback{border-radius:14px;padding:12px 14px;margin:12px 0;display:none}
.feedback.show{display:block}
.feedback.good{background:var(--ok-soft)} .feedback.bad{background:var(--rose-soft)} .feedback.info{background:var(--teal-soft)}
.notation{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:8px;overflow:hidden}
.notation svg{display:block;width:100%;height:auto;max-height:220px}
svg .st{stroke:var(--stave);fill:none}
svg .sf{fill:var(--stave)}
svg .hl{fill:var(--brass-strong)}
svg .hls{stroke:var(--brass-strong)}
/* clap pad */
.pad{width:100%;min-height:200px;border-radius:24px;border:3px dashed var(--teal);background:var(--teal-soft);cursor:pointer;font-weight:800;font-size:1.4rem;color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.pad.hit{background:var(--teal);color:var(--onaccent)}
.pad:disabled{opacity:.5}
/* self mark */
.selfmark{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.featgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.featgrid fieldset{border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin:0;min-width:0}
.featgrid legend{font-weight:700;padding:0 6px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;border-radius:10px;padding:0 6px}
.chk input{width:22px;height:22px;accent-color:var(--teal);flex:none}
.featgrid fieldset.short .chk{display:inline-flex;min-width:72px}
.singlive{border:2px solid var(--brass-strong);border-radius:16px;padding:12px 14px;margin:8px 0;background:var(--brass-soft)}
.singnote{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:2.6rem;text-align:center;line-height:1.1;margin:6px 0}
.singscale{position:relative;height:26px;border-radius:13px;background:var(--paper);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-size:.75rem;color:var(--muted)}
.singscale i{font-style:normal}.singscale i.mid{position:absolute;left:50%;top:3px;bottom:3px;width:2px;background:var(--ok)}
#singneedle{position:absolute;top:4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--ink);left:50%;transition:left .08s linear}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:.85rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--paper)}
.chip.ok{background:var(--ok-soft)}.chip.mid{background:var(--brass-soft)}.chip.no{background:var(--rose-soft)}
.singchart svg{max-height:240px}
.chk.right{background:var(--ok-soft)} .chk.wrong{background:var(--rose-soft)}
/* theory */
.gradebar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.gbtn{min-height:48px;min-width:64px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-weight:800;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.gbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gbtn:disabled{opacity:.5;cursor:not-allowed}
.lessons{counter-reset:les;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
.lesson{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;text-align:left;width:100%;min-height:64px}
.lesson:hover{background:var(--paper2)}
.lesson > div{min-width:0}
.lesson .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--brass);font-weight:800;color:var(--brass)}
.lesson.done .n{background:var(--brass-strong);color:var(--onaccent);border-color:var(--brass-strong)}
.explain{line-height:1.6}
.explain p{margin:.4em 0}
.explain ul{margin:.3em 0;padding-left:1.2em}
.explain .note{background:var(--brass-soft);border-radius:12px;padding:8px 12px}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.tablewrap{overflow-x:auto}
/* flashcards */
.flash{perspective:900px;margin:12px auto;max-width:520px}
.card3{position:relative;min-height:200px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.card3.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:2px solid var(--ink);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--brass-soft)}
.face .term{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:2rem;font-weight:800;font-style:italic;overflow-wrap:anywhere}
.glossary{columns:2;column-gap:28px}
.gl{break-inside:avoid;padding:6px 0;border-bottom:1px solid var(--line)}
.gl i{font-weight:700}
.search{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--paper);padding:0 14px;font:inherit;color:var(--ink);width:100%;max-width:360px}
/* gym */
.gymhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.timer{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:2.4rem;font-variant-numeric:tabular-nums}
.awaycard{border:3px solid var(--brass-strong);border-radius:20px;padding:18px;background:var(--brass-soft);margin-top:14px;position:relative}
.awaycard h3{margin-top:0}
.tasklist{margin:.4em 0;padding-left:1.2em}
.tasklist li{margin:.35em 0}
/* progress */
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.stat b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.9rem;font-weight:800;line-height:1.1}
.stat span{color:var(--muted);font-size:.88rem}
.barrow{display:grid;grid-template-columns:minmax(0,170px) 1fr 64px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.barrow > *{min-width:0}
.bar{height:14px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:8px}
.bar i.lo{background:var(--rose)} .bar i.mid{background:var(--brass-strong)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:2px dashed var(--line);border-radius:16px;padding:10px;text-align:center;color:var(--muted);min-width:0}
.badge.got{border:2px solid var(--brass-strong);background:var(--brass-soft);color:var(--ink)}
.badge svg{display:block;margin:0 auto 4px}
.badge b{display:block;font-size:.95rem}
.badge small{display:block;font-size:.78rem;line-height:1.25}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cols2 > *{min-width:0}
.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.field input[type=text]{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--paper);padding:0 10px;font:inherit;color:var(--ink);min-width:0;flex:1 1 140px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .panel{max-width:440px;width:100%}
footer{margin-top:30px;color:var(--muted);font-size:.85rem;text-align:center}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:60;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:10px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
.timeline svg{width:100%;height:auto;display:block}
.hidden{display:none !important}
.back{border:0;background:transparent;cursor:pointer;color:var(--teal);font-weight:700;min-height:44px;padding:0 4px}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:.85em;background:var(--paper2)}
@media (max-width:760px){
  .hero,.cols2{grid-template-columns:1fr}
  .skilllist,.lessons{grid-template-columns:1fr}
  .statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .glossary{columns:1}
  .featgrid{grid-template-columns:1fr}
  .brand small{display:none}
  .tab{font-size:.95rem;padding:0 8px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .barrow{grid-template-columns:minmax(0,110px) 1fr 52px}
  h2{font-size:1.4rem}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>

<header class="top">
  <div class="topin">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="11" fill="var(--ink)"/><g stroke="var(--bg)" stroke-width="1.3" opacity=".55"><line x1="6" y1="12" x2="34" y2="12"/><line x1="6" y1="17" x2="34" y2="17"/><line x1="6" y1="22" x2="34" y2="22"/><line x1="6" y1="27" x2="34" y2="27"/><line x1="6" y1="32" x2="34" y2="32"/></g><ellipse cx="16" cy="27" rx="4.6" ry="3.4" transform="rotate(-20 16 27)" fill="var(--brass-strong)"/><line x1="20.2" y1="26" x2="20.2" y2="8" stroke="var(--brass-strong)" stroke-width="2"/><path d="M20.2 8 C 23 12, 28 13, 26 19" stroke="var(--brass-strong)" stroke-width="2" fill="none"/></svg>

<main class="wrap" id="main"></main>

<script>
"use strict";

function autoBeam(events, beat){

const ALLK = r => { const a=[]; for (let k=-r;k<=r;k++) a.push(k); return a; };
const LESSONS = [
 // ---------- Grade 1 ----------
 {id:"g1-treble", g:1, topic:"Notes & clefs", t:"Treble clef notes", gen:"noteName", p:{clefs:["treble"], lo:"C4", hi:"G5"},
  h:`<p>The <b>treble clef</b> curls around the second line up — that line is <b>G</b>, so it’s also called the G clef. Violins and flutes read it.</p><p>Lines from the bottom: <b>E G B D F</b> (“Every Good Boy Deserves Fruit”). Spaces spell <b>F A C E</b>.</p><p><b>Middle C</b> sits on its own little ledger line just below the stave.</p>`, demo:{clef:"treble", notes:["E4","G4","B4","D5","F5"]}},
 {id:"g1-bass", g:1, topic:"Notes & clefs", t:"Bass clef notes", gen:"noteName", p:{clefs:["bass"], lo:"G2", hi:"C4"},
  h:`<p>The <b>bass clef</b>’s two dots sit either side of the fourth line — that line is <b>F</b> (the F clef). Cellos and double basses read it.</p><p>Lines from the bottom: <b>G B D F A</b> (“Good Boys Deserve Football Always”). Spaces: <b>A C E G</b> (“All Cows Eat Grass”).</p><p>Middle C is on a ledger line just <i>above</i> the bass stave.</p>`, demo:{clef:"bass", notes:["G2","B2","D3","F3","A3"]}},
 {id:"g1-values", g:1, topic:"Rhythm & time", t:"Note values", gen:"noteValue", p:{set:[4,3,2,1.5,1,0.5]},
  h:`<p>British names, with how many crotchet beats each lasts:</p><table class="tbl"><tr><td>semibreve</td><td>4</td></tr><tr><td>dotted minim</td><td>3</td></tr><tr><td>minim</td><td>2</td></tr><tr><td>dotted crotchet</td><td>1½</td></tr><tr><td>crotchet</td><td>1</td></tr><tr><td>quaver</td><td>½</td></tr></table><p class="note">A <b>dot</b> after a note adds half its value again: minim (2) + dot (1) = 3.</p>`},
 {id:"g1-rests", g:1, topic:"Rhythm & time", t:"Rests", gen:"restValue", p:{set:[4,2,1,0.5]},
  h:`<p>Every note value has a matching silence. The <b>semibreve rest</b> hangs <i>below</i> the fourth line; the <b>minim rest</b> sits <i>on top of</i> the middle line (“hat on, hole underneath”). The <b>crotchet rest</b> is the zig-zag, and the <b>quaver rest</b> looks like a 7 with a blob.</p><p class="note">A semibreve rest also means a whole bar’s rest in any time signature.</p>`},
 {id:"g1-time", g:1, topic:"Rhythm & time", t:"Time signatures 2/4, 3/4, 4/4", gen:"timeSigBar", p:{sigs:["2/4","3/4","4/4"]},
  h:`<p>The <b>top number</b> says how many beats in a bar; the <b>bottom number 4</b> means the beats are crotchets.</p><ul><li><b>2/4</b> — two crotchet beats (marches)</li><li><b>3/4</b> — three crotchet beats (waltzes)</li><li><b>4/4</b> — four crotchet beats (also written C)</li></ul>`},
 {id:"g1-barlines", g:1, topic:"Rhythm & time", t:"Adding bar lines", gen:"barlines", p:{sigs:["2/4","3/4","4/4"], lv:1},
  h:`<p>Count the beats from the start. Every time you reach the top number of the time signature, draw a <b>bar line</b>. Tap the gaps between notes to place bar lines, then check.</p><p class="note">The double bar at the end is already there for you.</p>`},
 {id:"g1-tones", g:1, topic:"Keys & scales", t:"Sharps, flats, tones & semitones", gen:"toneSemi", p:{},
  h:`<p>A <b>sharp ♯</b> raises a note by a semitone, a <b>flat ♭</b> lowers it by a semitone, and a <b>natural ♮</b> cancels a sharp or flat.</p><p>A <b>semitone</b> is the smallest step on a keyboard (e.g. E–F, B–C, F–F♯). A <b>tone</b> is two semitones (e.g. C–D, F–G).</p>`},
 {id:"g1-keys", g:1, topic:"Keys & scales", t:"Keys: C, G, D and F major", gen:"keySig", p:{keys:[0,1,2,-1], modes:["major"], clefs:["treble","bass"]},
  h:`<p>A <b>key signature</b> is the set of sharps or flats at the start of each line.</p><table class="tbl"><tr><td>C major</td><td>no sharps or flats</td></tr><tr><td>G major</td><td>F♯</td></tr><tr><td>D major</td><td>F♯, C♯</td></tr><tr><td>F major</td><td>B♭</td></tr></table><p>Every major scale has the pattern <b>tone tone semitone, tone tone tone semitone</b>.</p>`},
 {id:"g1-scales", g:1, topic:"Keys & scales", t:"Scale degrees", gen:"scaleDeg", p:{keys:[0,1,2,-1], modes:["major"]},
  h:`<p>Number the notes of a scale from the keynote (tonic) = 1 up to 8. In G major: G=1, A=2, B=3, C=4, D=5, E=6, F♯=7, G=8.</p><p class="note">The semitones in a major scale are always between <b>3–4</b> and <b>7–8</b>.</p>`},
 {id:"g1-intervals", g:1, topic:"Intervals", t:"Intervals by number", gen:"intNum", p:{keys:[0,1,2,-1], modes:["major"], clefs:["treble","bass"]},
  h:`<p>To find an interval’s number, count the letter names from the lower note to the upper note — <b>including both</b>. C up to G: C-D-E-F-G = 5, a <b>5th</b>. C to the next C is an <b>octave (8ve)</b>.</p>`},
 {id:"g1-triads", g:1, topic:"Chords", t:"Tonic triads", gen:"tonicTriad", p:{keys:[0,1,2,-1], modes:["major"]},
  h:`<p>A <b>triad</b> is three notes stacked in 3rds: 1st, 3rd and 5th notes of the scale. The <b>tonic triad</b> is built on the keynote — in G major that’s G-B-D.</p><p>On the stave, a root-position triad looks like a snowman: three lines or three spaces in a row.</p>`},
 {id:"g1-terms", g:1, topic:"Terms & signs", t:"Grade 1 terms", gen:"terms", p:{g:1}, h:`<p>Musical terms in Italian for speed, volume and style. Flip the flashcards first, then try the quiz.</p>`},
 // ---------- Grade 2 ----------
 {id:"g2-ledger", g:2, topic:"Notes & clefs", t:"Two ledger lines", gen:"noteName", p:{clefs:["treble","bass"], lo:{treble:"A3",bass:"C2"}, hi:{treble:"C6",bass:"E4"}},
  h:`<p><b>Ledger lines</b> extend the stave. Count lines and spaces just like on the stave: in treble clef, below middle C comes B (space), then A (on the second ledger line). Above the treble stave: G (space), A (1st ledger), B (space), C (2nd ledger).</p>`},
 {id:"g2-semiq", g:2, topic:"Rhythm & time", t:"Semiquavers & dotted quavers", gen:"noteMath", p:{set:[2,1.5,1,0.75,0.5,0.25]},
  h:`<p>A <b>semiquaver</b> (two tails) lasts a quarter of a crotchet. A <b>dotted quaver</b> = 3 semiquavers, so a dotted quaver + a semiquaver = 1 crotchet beat.</p><table class="tbl"><tr><td>1 crotchet</td><td>= 2 quavers = 4 semiquavers</td></tr><tr><td>1 dotted crotchet</td><td>= 3 quavers = 6 semiquavers</td></tr></table>`},
 {id:"g2-triplets", g:2, topic:"Rhythm & time", t:"Triplets", gen:"triplets", p:{},
  h:`<p>A <b>triplet</b> squeezes three notes into the time of two of the same kind. A quaver triplet (three quavers with a little ‘3’) lasts one crotchet beat.</p>`},
 {id:"g2-time", g:2, topic:"Rhythm & time", t:"Time signatures with minim beats", gen:"timeSigBar", p:{sigs:["2/4","3/4","4/4","2/2","3/2"]},
  h:`<p>A <b>bottom 2</b> means minim beats. <b>2/2</b> = two minim beats (also written ₵, ‘alla breve’), <b>3/2</b> = three minim beats, <b>4/2</b> = four.</p><p class="note">3/2 holds the same total as six crotchets.</p>`},
 {id:"g2-barlines", g:2, topic:"Rhythm & time", t:"Bar lines with semiquavers", gen:"barlines", p:{sigs:["2/4","3/4","4/4","2/2","3/2"], lv:2}, h:`<p>Same method: count steadily. Semiquavers come in fours to make a crotchet beat; dotted quaver + semiquaver = one beat.</p>`},
 {id:"g2-keys", g:2, topic:"Keys & scales", t:"Keys up to 3 sharps or flats", gen:"keySig", p:{keys:[-3,-2,-1,0,1,2,3], modes:["major","minor"], clefs:["treble","bass"]},
  h:`<p>New major keys: <b>A major</b> (F♯ C♯ G♯), <b>B♭ major</b> (B♭ E♭), <b>E♭ major</b> (B♭ E♭ A♭).</p><p>Every major key has a <b>relative minor</b> sharing its key signature, three semitones lower: C major ↔ A minor, G major ↔ E minor, F major ↔ D minor.</p>`},
 {id:"g2-minor", g:2, topic:"Keys & scales", t:"Harmonic & melodic minor", gen:"minorScale", p:{keys:[0,1,-1]},

 {id:"g2-intervals", g:2, topic:"Intervals", t:"Intervals in more keys", gen:"intNum", p:{keys:[-3,-2,-1,0,1,2,3], modes:["major","minor"], clefs:["treble","bass"]}, h:`<p>Still count letter names, including both notes. Accidentals don’t change the <i>number</i> of an interval — C to G♯ is still a 5th.</p>`},
 {id:"g2-triads", g:2, topic:"Chords", t:"Tonic triads, majors & minors", gen:"tonicTriad", p:{keys:[-3,-2,-1,0,1,2,3], modes:["major","minor"]}, h:`<p>A minor key’s tonic triad has a <b>minor 3rd</b>: A minor = A-C-E. Its key signature is shared with its relative major.</p>`},
 {id:"g2-terms", g:2, topic:"Terms & signs", t:"Grade 2 terms", gen:"terms", p:{g:2}, h:`<p>Small connecting words (con, ma, non, più, meno) let you read longer instructions like <i>allegro ma non troppo</i> — quick, but not too much.</p>`},

 {id:"g3-demisemi", g:3, topic:"Rhythm & time", t:"Demisemiquavers", gen:"noteMath", p:{set:[1.5,1,0.75,0.5,0.25,0.125]}, h:`<p>A <b>demisemiquaver</b> has three tails/beams: eight of them fit in one crotchet beat.</p>`},

 {id:"g3-terms", g:3, topic:"Terms & signs", t:"Grade 3 terms", gen:"terms", p:{g:3}, h:`<p>Mood words: many end in <i>-oso</i> or <i>-ando</i>. Learn them as pictures: <i>maestoso</i> = a king walking in.</p>`},

 {id:"g5-keys", g:5, topic:"Keys & scales", t:"All keys, all clefs", gen:"keySig", p:{keys:ALLK(7), modes:["major","minor"], clefs:["treble","bass","alto","tenor"]}, h:`<p>Up to seven sharps (C♯ major / A♯ minor) and seven flats (C♭ major / A♭ minor). In the tenor clef, sharps follow their own zig-zag pattern starting low.</p>`},

 {id:"g5-chords", g:5, topic:"Chords", t:"Chords I, II, IV, V & inversions", gen:"chordFunc", p:{keys:ALLK(4), chords:[1,2,4,5], inv:true},

 {id:"g5-cadences", g:5, topic:"Chords", t:"Cadences", gen:"cadenceT", p:{keys:ALLK(4)},

const LESSON_BY = Object.fromEntries(LESSONS.map(l => [l.id, l]));
const THEORY_TOPICS = ["Notes & clefs","Rhythm & time","Keys & scales","Intervals","Chords","Terms & signs","Transposition","Instruments"];
</script>
<script>
/* ===================== shared generator helpers ===================== */
const SC = { major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,11], natural:[0,2,3,5,7,8,10] };
const degM = (tm, deg, scale) => tm + scale[((deg%7)+7)%7] + 12*Math.floor(deg/7);
function tonicMidi(k, mode, lo=55, hi=66){ let m = midiOf(mode==="minor"?minorTonic(k):majorTonic(k)); while (m > hi) m -= 12; while (m < lo) m += 12; return m; }
const KEYLBL = (k, mode) => keyName(k, mode);
function opt(k, html){ return {k:String(k), html: html==null ? esc(k) : html}; }
function optsFrom(answer, pool, n){ const others = shuffle(pool.filter(x => x !== answer)).slice(0, Math.max(1, n-1)); return shuffle([answer, ...others]).map(x => opt(x)); }
const nOpts = diff => diff < 0.35 ? 3 : diff < 0.7 ? 4 : 6;
const fmtBeats = d => ({0.125:"⅛",0.25:"¼",0.375:"⅜",0.5:"½",0.75:"¾",1.5:"1½",2.5:"2½",3.5:"3½"})[d] || String(d);
const DUR_NAME = {8:"breve",6:"dotted semibreve",4:"semibreve",3:"dotted minim",2:"minim",1.5:"dotted crotchet",1:"crotchet",0.75:"dotted quaver",0.5:"quaver",0.25:"semiquaver",0.125:"demisemiquaver"};
const PLAY_ICON = `<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>`;

/* voice-leading for four-part chords */
function voiceChord(pcs, bassPc, prev){
  const cands = [];
  const notes = []; for (let m=55; m<=79; m++) if (pcs.includes(((m%12)+12)%12)) notes.push(m);
  for (let a=0;a<notes.length;a++) for (let b=a+1;b<notes.length;b++) for (let c=b+1;c<notes.length;c++){
    const tri = [notes[a],notes[b],notes[c]]; if (tri[2]-tri[0] > 12) continue;
    const set = new Set(tri.map(m => m%12)); if (!set.has(pcs[1]%12)) continue; if (pcs.length>3 && !set.has(pcs[3]%12)) continue; if (pcs.length===3 && set.size < 2) continue;
    const sc = prev ? Math.abs(tri[0]-prev.up[0])+Math.abs(tri[1]-prev.up[1])+Math.abs(tri[2]-prev.up[2]) : Math.abs(tri[1]-67);
    cands.push({tri, sc: sc + (set.size===3?0:1.5) + Math.random()*0.5});
  }
  cands.sort((x,y) => x.sc - y.sc);
  const up = cands[0].tri;
  let bass = 36 + ((bassPc - 36) % 12 + 12) % 12; // 36..47
  if (prev){ while (bass + 12 <= 55 && Math.abs(bass+12-prev.bass) < Math.abs(bass-prev.bass)) bass += 12; }
  else if (bass < 43) bass += 12;
  if (bass >= up[0]) bass -= 12;
  return {bass, up};
}
function chordPcs(tpc, mode, deg, seventh=false){
  const sc = SC[mode==="minor"?"minor":"major"]; const d0 = deg-1;
  const p = [0,2,4].map(s => (tpc + sc[(d0+s)%7]) % 12); if (seventh) p.push((tpc + sc[(d0+6)%7]) % 12);
  return p;
}
function progEvents(chords, beats){ // chords: [{pcs, bassPc}], returns events
  let prev = null, t = 0; const ev = [];
  chords.forEach((c, i) => { const v = voiceChord(c.pcs, c.bassPc==null?c.pcs[0]:c.bassPc, prev); prev = v; const d = beats[i] || 1; ev.push({m:[v.bass, ...v.up], t, d, v:0.7}); t += d; });
  return ev;
}
function melodyDegrees(len, maxLeap, lo=-2, hi=7, start=0){
  const out = [start];
  while (out.length < len){
    const last = out[out.length-1]; let step;
    if (Math.random() < 0.65 || maxLeap <= 1) step = pick([-1,1]); else step = pick([-1,1]) * (2 + rnd(Math.max(1, maxLeap-1)));
    let nx = last + step; if (nx < lo || nx > hi) nx = last - step; if (nx < lo || nx > hi) nx = last;
    out.push(nx);
  }
  return out;
}

/* ===================== AURAL generators ===================== */
const AGEN = {};
AGEN.intervals = (L, diff) => {
  const lv = AURAL_BY.intervals.levels[L-1];
  const key = pick(lv.set); const iv = INTS[key];
  let mode = lv.mode; if (mode === "updown") mode = pick(["up","up","down"]); if (mode === "mix") mode = pick(["up","down","harm"]);
  const lo = 50 + rnd(14); const hi = lo + iv.s; const low = hi > 84 ? lo - 12 : lo; const high = low + iv.s;
  const bpm = 64 + Math.round(diff*36);
  const ev = mode === "harm" ? [{m:[low,high], t:0, d:2.2, v:.75}] : mode === "down" ? seq([high,low], 1.2) : seq([low,high], 1.2);
  const n = Math.min(lv.set.length, nOpts(diff));
  const pool = lv.set.filter(x => x !== key);
  const near = pool.sort((a,b) => Math.abs(INTS[a].s-iv.s) - Math.abs(INTS[b].s-iv.s));
  const chosen = shuffle([key, ...shuffle(near.slice(0, Math.min(near.length, n+1))).slice(0, n-1)]);
  const how = mode === "harm" ? "played together (harmonic)" : mode === "down" ? "going down (melodic)" : "going up (melodic)";
  return { prompt:`Name the interval — ${how}.`, play:() => playEvents(ev, bpm),
    extra:[{label:"Notes one at a time", fn:() => playEvents(seq(mode==="down"?[high,low]:[low,high], 1.4), 60)}],
    options: chosen.map(k => opt(k, esc(INTS[k].n))), answer:key,
    explain:`It was a <b>${INTS[key].n}</b> (${iv.s} semitone${iv.s===1?"":"s"}). Memory hook: ${esc(iv.song)}.`,
    away:{kind:"interval", name:INTS[key].n, semis:iv.s} };
};
AGEN.triads = (L, diff) => {
  const lv = AURAL_BY.triads.levels[L-1];
  const root = 52 + rnd(10);
  if (lv.sev){
    const S = {"dominant 7th":[0,4,7,10],"major 7th":[0,4,7,11],"minor 7th":[0,3,7,10],"diminished 7th":[0,3,6,9]};
    const k = pick(Object.keys(S)); const ms = S[k].map(x => root + x);
    return { prompt:"What kind of seventh chord is this?", play:() => playEvents([{m:ms, t:0, d:2, v:.7},{m:ms, t:2.4, d:2.5, v:.7, roll:true}], 70),
      extra:[{label:"Broken chord", fn:() => playEvents(seq(ms, .7), 80)}], options: Object.keys(S).map(x => opt(x)), answer:k,
      explain:`A <b>${k}</b> chord. Dominant 7th = major triad + minor 7th (wants to resolve); major 7th = dreamy, jazzy; minor 7th = soft and mellow; diminished 7th = all minor 3rds, very tense.`, away:{kind:"triad", name:k} };
  }
  let qual, inv = 0;
  if (lv.q){ qual = pick(lv.q); } else { qual = lv.inv === "both" ? pick(["major","minor"]) : lv.inv; inv = rnd(3); }
  const iv = TRIAD[qual].map(([n,q]) => semisFor(n,q)); let ms = [root, root+iv[0], root+iv[1]];
  if (inv === 1) ms = [ms[1], ms[2], ms[0]+12]; if (inv === 2) ms = [ms[2], ms[0]+12, ms[1]+12];
  const INV = ["root position","1st inversion","2nd inversion"];
  const ev = [{m:ms, t:0, d:2, v:.72},{m:ms, t:2.5, d:2.5, v:.72, roll:true}];
  let options, answer, explain;
  if (lv.q){ options = lv.q.map(x => opt(x)); answer = qual; explain = `It was <b>${qual}</b>. ${qual==="major"?"Bright and settled.":qual==="minor"?"Darker, more serious.":qual==="diminished"?"Squeezed and tense — two minor 3rds.":"Stretched and dreamy — two major 3rds."}`; }
  else if (lv.inv !== "both"){ options = INV.map(x => opt(x)); answer = INV[inv]; explain = `It was in <b>${INV[inv]}</b>. Listen to the bass: root position sounds most solid; 2nd inversion sounds as if it wants to move.`; }
  else { const all = []; ["major","minor"].forEach(q => INV.forEach(i => all.push(q+", "+i))); answer = qual+", "+INV[inv]; options = optsFrom(answer, all, Math.max(4,nOpts(diff))); explain = `<b>${answer}</b>.`; }
  return { prompt: lv.q ? "Is this chord major, minor, diminished or augmented?" : lv.inv === "both" ? "Name the chord and its position." : `This ${qual} chord — which position?`,
    play:() => playEvents(ev, 72), extra:[{label:"Just the bass note", fn:() => playEvents([{m:ms[0], t:0, d:2}], 72)},{label:"Broken chord", fn:() => playEvents(seq(ms, .7), 80)}],
    options, answer, explain, away:{kind:"triad", name: qual} };
};
AGEN.cadences = (L, diff) => {
  const lv = AURAL_BY.cadences.levels[L-1];
  const mode = (lv.minor || lv.chords) && Math.random() < 0.4 ? "minor" : "major";
  const k = rnd(7) - 3; const tm = tonicMidi(k, mode); const tpc = tm % 12;
  const C = (deg, seventh=false, bassDeg=null) => ({pcs: chordPcs(tpc, mode, deg, seventh), bassPc: bassDeg==null ? null : (tpc + SC[mode==="minor"?"minor":"major"][bassDeg-1]) % 12});
  const pre = pick(mode === "minor" ? [[1,4],[1,6],[1,4,1]] : [[1,4],[1,6],[1,2],[1,4,1],[1,6,2]]);
  let type, cad, label;
  if (lv.chords){
    const choices = mode === "minor" ? ["V–I","IV–I","I–V","IV–V","Ic–V","V–VI"] : ["V–I","IV–I","I–V","IV–V","II–V","Ic–V","V–VI"];
    label = pick(choices);
    const map = {"V–I":[C(5),C(1)],"IV–I":[C(4),C(1)],"I–V":[C(1),C(5)],"IV–V":[C(4),C(5)],"II–V":[C(2),C(5)],"Ic–V":[C(1,false,5),C(5)],"V–VI":[C(5),C(6)]};

/* ---------- Test A: singing back a part ---------- */
AGEN.parts = (L, diff) => {
  const lv = AURAL_BY.parts.levels[L-1];
  const mode = Math.random() < .35 ? "minor" : "major"; const k = rnd(5)-2;
  const tm = tonicMidi(k, mode); const tpc = tm % 12; const kp = keyPcs(tpc, mode);
  const ts = pick(["4/4","3/4"]); const bl = +ts[0];
  const durs = ts === "4/4" ? [1,1,1,1,1,1,2] : [1,1,1,1,2];
  const end = pick(["perfect","perfect","imperfect"]);
  const pair = end === "perfect" ? [5,1] : [pick([1,4]), 5];
  let degs = walkProg(durs.length - 2); if (degs[degs.length-1] === pair[0]) degs[degs.length-1] = pair[0] === 1 ? 6 : 1; if (degs.length > 1 && degs[degs.length-1] === degs[degs.length-2]) degs[degs.length-1] = 4; degs = degs.concat(pair);

  return { type:"self", prompt:`Listen to this ${three ? "three" : "two"}-part phrase in ${keyName(k, mode)}, then sing back the ${which} part — any comfortable octave, to “la”.`,
    play:() => playEvents([keyChordEv(tm, mode), ...shiftEv(phrase, 2.5)], bpm), playLabel:"Key chord + phrase",
    extra:[{label:"Phrase again", fn:() => playEvents(phrase, bpm)},{label:"Starting note", fn:() => playEvents([{m:sing[0].m, t:0, d:2, v:.85}], 80)},{label:"Check: your part alone", fn:() => playEvents(lineEv(sing, .82), bpm)}],
    reveal: lineStaff(sing, k, mode, singIdx === 0 ? "treble" : "bass", bl, ts, `the ${which} part`),

/* ---------- Test B (Gr 6–8): sight-singing with a second part ---------- */

/* ---------- Test C: cadences, chords and progressions ---------- */

AGEN.cadchords = (L, diff) => {

    cats = labels.slice(1).map((l, i) => ({c:"ch"+(i+2), lbl:`Chord ${i+2}${i === labels.length-2 ? " (last)" : ""}`, opts:copt(lv.chords), ans:l}));

/* ---------- Test C (Gr 8): two modulations in one passage ---------- */

  tonal:{lbl:"Tonality", o:{major:"major", minor:"minor"}}

const MIC = { stream:null, ctx:null, an:null, buf:null, src:null, sink:null, on:false, timer:0, frames:[], t0:0, err:null, finish:null };

  const {segs, sm} = segmentTrack(frames);

function singChartSVG(g){
  const W = 640, H = 210, L = 44, Rm = 10, Tp = 12, Bt = 26;
  const fr = g.frames; const tEnd = Math.max(fr.length ? fr[fr.length-1].t : 1, .5);
  const tx = t => L + (t / tEnd) * (W - L - Rm);
  const tm = g.T.map(t => t.m); const sung = g.sm.filter(x => x != null).map(x => x + g.shift);
  let lo = Math.min(...tm, ...(sung.length ? [Math.min(...sung)] : [])) - 1.5, hi = Math.max(...tm, ...(sung.length ? [Math.max(...sung)] : [])) + 1.5;
  lo = Math.max(lo, Math.min(...tm) - 7); hi = Math.min(hi, Math.max(...tm) + 7);
  const ty = m => Tp + (hi - clamp(m, lo, hi)) / (hi - lo) * (H - Tp - Bt);
  let s = "";
  [...new Set(tm)].forEach(m => { s += `<line x1="${L}" x2="${W-Rm}" y1="${ty(m)}" y2="${ty(m)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${ty(m)+4}" text-anchor="end" font-size="11" class="sf">${midiName(m)}</text>`; });
  const col = st => st === "good" ? "var(--ok)" : st === "close" ? "var(--brass-strong)" : "var(--rose)";
  // where each written note should be, using the fitted tempo if there is one
  const tot = g.T.reduce((u,t) => u + t.d, 0);
  g.T.forEach(t => { const x0 = g.fit ? tx(g.fit.a*t.b + g.fit.b) : tx(t.b/tot*tEnd), x1 = g.fit ? tx(g.fit.a*(t.b+t.d) + g.fit.b) : tx((t.b+t.d)/tot*tEnd);
    s += `<rect x="${Math.max(L, x0)}" y="${ty(t.m)-6}" width="${Math.max(6, Math.min(W-Rm, x1) - Math.max(L, x0) - 3)}" height="12" rx="5" fill="${col(t.st)}" opacity=".28"/>`; });
  // the voice
  let d = ""; g.sm.forEach((m, i) => { if (m == null){ d += " "; return; } const x = tx(fr[i].t), y = ty(m + g.shift); d += (d.endsWith(" ") || !d ? `M${x.toFixed(1)} ${y.toFixed(1)}` : `L${x.toFixed(1)} ${y.toFixed(1)}`); });
  s += `<path d="${d.replace(/ +/g, " ").trim()}" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  g.T.forEach((t, i) => { if (t.at == null) return; s += `<circle cx="${tx(t.at)}" cy="${ty(t.sung)}" r="5" fill="${col(t.st)}"/>`; });
  s += `<text x="${L}" y="${H-8}" font-size="11" class="sf">time →</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Your singing (dark line) against the written notes (coloured bars)">${s}</svg>`;
}
function singResultHTML(g){
  if (!g.heard) return `I didn’t hear any singing. Check the microphone, move a little closer and sing on “la”.`;
  const chips = g.T.map((t, i) => { const lbl = midiName(t.m);
    if (t.st === "missed") return `<span class="chip no">${i+1}. ${lbl} — missed</span>`;
    const c = Math.round(t.dev*100); const way = c > 0 ? "sharp" : "flat";
    return `<span class="chip ${t.st==="good"?"ok":t.st==="close"?"mid":"no"}">${i+1}. ${lbl} ${t.st==="good" ? "✓" : t.st==="close" ? `a little ${way}` : `— you sang ${midiName(t.sung)}`}</span>`; }).join("");
  const rh = g.rhythm == null ? "" : ` · Rhythm: <b>${Math.round(g.rhythm*100)}%</b> in time`;
  return `Notes in tune: <b>${g.good}</b> of ${g.T.length}${g.close ? ` (+${g.close} nearly)` : ""}${rh}.
   <div class="notation singchart" style="margin-top:8px">${singChartSVG(g)}</div><div class="chips">${chips}</div>
   <p class="muted" style="margin:.4em 0 0;font-size:.88rem">Dark line = your voice. Bars = the written notes. Any octave counts; within a quarter-tone counts as in tune.${g.shift % 12 ? "" : ""}</p>`;
}

async function micOpen(){
  if (MIC.stream) return true;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error("none"), {name:"NotSupportedError"});
    MIC.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    const ctx = audioInit(); MIC.ctx = ctx;
    MIC.src = ctx.createMediaStreamSource(MIC.stream); MIC.an = ctx.createAnalyser(); MIC.an.fftSize = 2048;
    MIC.sink = ctx.createGain(); MIC.sink.gain.value = 0; MIC.src.connect(MIC.an); MIC.an.connect(MIC.sink); MIC.sink.connect(ctx.destination);
    MIC.buf = new Float32Array(2048); MIC.err = null; return true;
  } catch(e){ MIC.err = (e && e.name) || "Error"; MIC.stream = null; return false; }
}
function micClose(){

  const finish = (why) => { if (done) return; done = true; clearInterval(MIC.timer); MIC.timer = 0; MIC.on = false; MIC.finish = null; onDone(gradeSinging(MIC.frames, q.target), why); };
  MIC.finish = finish;
  MIC.timer = setInterval(() => {
    if (!MIC.an) return finish("lost");
    MIC.an.getFloatTimeDomainData(MIC.buf); const r = yin(MIC.buf, MIC.ctx.sampleRate); const t = (performance.now() - MIC.t0)/1000;
    const m = r.f ? hzToMidi(r.f) : null; MIC.frames.push({t, m, rms:r.rms});

async function singStart(){

    return;
  }
  box.innerHTML = `<div class="singlive" role="status"><div class="row" style="justify-content:space-between"><b>Listening… sing on “la”</b><span class="muted" id="singstat">0.0 s</span></div>
    <div class="singnote" id="singnote">Sing now</div><div class="singscale" aria-hidden="true"><i class="flat">flat</i><i class="mid"></i><i class="sharp">sharp</i><span id="singneedle"></span></div>

    options: optsFrom(ans, [...new Set(pool)], 4), answer: ans, explain:`${nm(t)} up to ${nm(top)} is ${iv.semis} semitones: a <b>${ans}</b>.` };
};
TGEN.intAny = (p, diff) => {
  let lo, hi, iv, tries = 0;
  do {
    lo = N(rnd(7), pick([0,0,0,1,-1]), pick([3,4])); const num = 2 + rnd(p.maxNum - 1);
    const s = (num-1)%7; const q = PERF.includes(s) ? pick(["P","P","A","d"]) : pick(["M","m","M","m","A","d"]);
    hi = upBy(lo, num, q); iv = {num, q}; tries++;
  } while ((Math.abs(hi.acc) > 1 || diaOf(hi) > 44) && tries < 50);
  const clef = diaOf(lo) < 27 ? "bass" : "treble";
  if (clef === "treble" && diaOf(lo) < 26){ lo.oct++; hi.oct++; }
  const ans = intName(iv.num, iv.q); const s = (iv.num-1)%7;
  const pool = (PERF.includes(s) ? ["P","A","d"] : ["M","m","A","d"]).map(q => intName(iv.num, q)).concat([intName(iv.num+1 > 15 ? iv.num-1 : iv.num+1, PERF.includes(iv.num%7) ? "P" : "M")]);
  const harm = Math.random() < .4;
  return { prompt:`Name this interval fully.`, visual: staffSVG({clef, events: harm ? [{keys:[lo, hi], d:4}] : [{keys:[lo], d:4},{keys:[hi], d:4}], noKeyAcc:true, minW:200}),
    options: optsFrom(ans, [...new Set(pool)], 4), answer: ans, explain:`${nm(lo)} up to ${nm(hi)}: count letters → ${ORD[iv.num-1]}; ${midiOf(hi)-midiOf(lo)} semitones → <b>${ans}</b>.` };
};
TGEN.tonicTriad = (p) => {
  const k = pick(p.keys), mode = pick(p.modes); const t0 = mode==="minor" ? minorTonic(k) : majorTonic(k);
  const t = N(t0.L, t0.acc, t0.L >= 5 ? 3 : 4); const clef = t.oct === 3 && Math.random()<.5 ? "bass" : "treble"; if (clef==="treble" && t.oct===3) t.oct = 4;
  const tri = triadOf(t, mode);
  const options = shuffle([k, ...shuffle(p.keys.filter(x => x!==k)).slice(0,3)]).map(x => opt(keyName(x, mode)));
  return { prompt:`This is the tonic triad of which ${mode} key?`, visual: staffSVG({clef, events:[{keys:tri, d:4}], noKeyAcc:true, minW:150}), options, answer:keyName(k,mode),
    explain:`The lowest note of a root-position tonic triad is the keynote: ${tri.map(nm).join("–")} = <b>${keyName(k,mode)}</b>.` };
};
TGEN.chordFunc = (p) => {
  const k = pick(p.keys); const mode = Math.random() < .3 ? "minor" : "major";
  const t0 = mode==="minor" ? minorTonic(k) : majorTonic(k); const t = N(t0.L, t0.acc, 4);
  const sc = scaleOf(t, mode==="minor"?"harmonic":"major"); const deg = pick(p.chords);
  const root = sc[deg-1]; let notes = [root, sc[(deg+1)%7 + (deg+1>=7?0:0)], null];
  const at = i => { const n = sc[(deg-1+i)%7]; const o = Object.assign({}, n); if (deg-1+i >= 7) o.oct++; return o; };
  notes = [at(0), at(2), at(4)];
  let inv = p.inv ? pick(["a","a","b","c"]) : "";
  if (inv === "b") notes = [notes[1], notes[2], Object.assign({}, notes[0], {oct:notes[0].oct+1})];
  if (inv === "c") notes = [notes[2], Object.assign({}, notes[0], {oct:notes[0].oct+1}), Object.assign({}, notes[1], {oct:notes[1].oct+1})];
  if (diaOf(notes[2]) > 39) notes = notes.map(n => Object.assign({}, n, {oct:n.oct-1}));
  const lbl = ROMAN[deg-1] + (inv && inv!=="a" ? inv : "");
  const pool = []; p.chords.forEach(c => (p.inv ? ["","b","c"] : [""]).forEach(i => pool.push(ROMAN[c-1]+i)));
  const ans = inv === "a" ? ROMAN[deg-1] : lbl;
  return { prompt:`In ${keyName(k, mode)}, which chord is this?${p.inv?" (Root position has no letter; b = 1st inversion, c = 2nd inversion.)":""}`, visual: staffSVG({clef:"treble", key:k, events:[{keys:notes, d:4}], minW:170}),
    options: optsFrom(ans, pool, p.inv ? 5 : 3), answer: ans, explain:`The chord is ${notes.map(nm).join("–")}: its root is ${nm(root)}, degree ${deg} → <b>${ans}</b>${inv==="b"?" (3rd in the bass)":inv==="c"?" (5th in the bass)":""}.` };
};
TGEN.cadenceT = (p) => {
  const k = pick(p.keys); const t = N(majorTonic(k).L, majorTonic(k).acc, 4); const sc = scaleOf(t, "major");
  const type = pick(["perfect","imperfect","plagal","interrupted"]);
  const pair = type==="perfect"?[5,1]:type==="plagal"?[4,1]:type==="interrupted"?[5,6]:pick([[1,5],[4,5],[2,5]]);
  const tri = deg => [0,2,4].map(i => { const n = Object.assign({}, sc[(deg-1+i)%7]); if (deg-1+i >= 7) n.oct++; if (diaOf(n) > 36) n.oct--; return n; });
  return { prompt:`In ${keyName(k,"major")}: chord ${ROMAN[pair[0]-1]} then chord ${ROMAN[pair[1]-1]}. Which cadence is it?`, visual: staffSVG({clef:"treble", key:k, events:[{keys:tri(pair[0]), d:2, label:ROMAN[pair[0]-1]},{keys:tri(pair[1]), d:2, label:ROMAN[pair[1]-1]},{bar:"end"}], minW:200}),
    options:["perfect","imperfect","plagal","interrupted"].map(x => opt(x)), answer:type, explain:`${ROMAN[pair[0]-1]} → ${ROMAN[pair[1]-1]} is a <b>${type}</b> cadence.` };
};
TGEN.octaveClef = () => {
  const n = fromDia(28 + rnd(12)); // C4..G5
  const target = N(n.L, 0, n.oct - 1); const wrong1 = fromDia(diaOf(target) + pick([1,-1,2])); const wrong2 = Object.assign({}, n); // same pitch
  const mk = x => staffSVG({clef:"bass", events:[{keys:[x], d:4}], noKeyAcc:true, minW:120, scale:1.2});
  const opts = shuffle([["a",target],["b",wrong1],["c",wrong2]]);
  return { prompt:`Which bass-clef note is exactly one octave LOWER than this treble-clef ${nm(n)}?`, visual: staffSVG({clef:"treble", events:[{keys:[n], d:4}], noKeyAcc:true, minW:140}),
    options: opts.map(([k,x]) => ({k, html: mk(x), svg:true})), answer:"a",
    explain:`One octave lower is ${nm(target)}${target.oct} — ${posWords("bass", target)} of the bass stave.${diaOf(wrong2)<=33?` (Careful: the same-pitch ${nm(n)} would sit higher.)`:""}` };
};
TGEN.enharmonic = () => {
  let n; do { n = N(rnd(7), pick([-2,-1,1,2,1,-1]), 4); } while (false);
  const m = midiOf(n); const cands = [];
  for (let L=0; L<7; L++) for (let a=-2; a<=2; a++){ const x = N(L, a, 4); for (const o of [3,4,5]){ x.oct = o; if (midiOf(x) === m && L !== n.L) cands.push(nm(x)); } }
  const ans = pick(cands.filter(c => c.length <= 2) .length ? cands.filter(c => c.length <= 2) : cands);
  const wrong = new Set(); [1,-1,2,-2].forEach(s => { const x = N((n.L+7+Math.sign(s))%7, 0, 4); wrong.add(nm(x)+accStr(pick([0,1,-1]))); });
  wrong.delete(ans); cands.forEach(c => wrong.delete(c));
  return { prompt:`Which note sounds exactly the same as ${nm(n)} (${LET[n.L]}${accWord(n.acc)})?`, options: shuffle([ans, ...shuffle([...wrong]).slice(0,3)]).map(x => opt(x)), answer:ans,
    explain:`${nm(n)} and <b>${ans}</b> are enharmonic: same key on the piano, different spelling.` };
};
TGEN.degreeName = (p) => {
  const k = pick(p.keys); const mode = Math.random()<.3 ? "minor" : "major"; const t0 = mode==="minor"?minorTonic(k):majorTonic(k);
  const sc = scaleOf(N(t0.L,t0.acc,4), mode==="minor"?"harmonic":"major"); const deg = 1 + rnd(7);
  if (Math.random() < .5) return { prompt:`In ${keyName(k,mode)}, what is the ${DEG_NAMES[deg-1]}?`, options: optsFrom(nm(sc[deg-1]), sc.slice(0,7).map(nm), 4), answer: nm(sc[deg-1]), explain:`The ${DEG_NAMES[deg-1]} is degree ${deg}: <b>${nm(sc[deg-1])}</b>.` };
  return { prompt:`In ${keyName(k,mode)}, ${nm(sc[deg-1])} is the…`, options: optsFrom(DEG_NAMES[deg-1], DEG_NAMES, 4), answer: DEG_NAMES[deg-1], explain:`${nm(sc[deg-1])} is degree ${deg}: the <b>${DEG_NAMES[deg-1]}</b>.` };
};
TGEN.ornament = () => {
  const o = pick(ORN.slice(0,7));
  if (Math.random() < .6) return { prompt:"Name this ornament.", visual:`<div style="text-align:center">${ornSVG(o)}</div>`, options: optsFrom(o.n, ORN.map(x=>x.n), 4), answer:o.n, explain:`<b>${o.n}</b>: ${o.d}.` };
  return { prompt:`Which ornament means: “${o.d}”?`, options: shuffle([o, ...shuffle(ORN.filter(x=>x!==o)).slice(0,3)]).map(x => ({k:x.n, html:ornSVG(x)+`<div style="font-size:.85rem">${esc(x.n)}</div>`})), answer:o.n, explain:`That’s the <b>${o.n}</b>.` };
};
TGEN.instr = (p) => {
  const pool = INST_Q.filter(q => q[3] === p.g || (p.g === 5 && Math.random() < .3)); const q = pick(pool);
  return { prompt:q[0], options: shuffle([q[1], ...q[2]]).map(x => opt(x)), answer:q[1], explain:`<b>${esc(q[1])}</b>. ${esc(q[4])}` };
};
TGEN.terms = (p) => {
  const pool = TERMS.filter(t => t[2] === p.g); const t = pick(pool);
  const meanings = [...new Set(pool.map(x => x[1]))].filter(m => m !== t[1]);
  if (Math.random() < .3){ const others = shuffle(pool.filter(x => x[1] !== t[1])).slice(0,3);
    return { prompt:`Which term means “${t[1]}”?`, options: shuffle([t, ...others]).map(x => opt(x[0], `<i>${esc(x[0])}</i>`)), answer:t[0], explain:`<i>${esc(t[0])}</i> = ${esc(t[1])}.`, term:t[0] }; }
  return { prompt:`What does “${t[0]}” mean?`, options: shuffle([t[1], ...shuffle(meanings).slice(0,3)]).map(x => opt(x)), answer:t[1], explain:`<i>${esc(t[0])}</i>${t[3]!=="It"?` (${t[3]==="Fr"?"French":"German"})`:""} = <b>${esc(t[1])}</b>.`, term:t[0] };
};
TGEN.transpose = () => {
  const r = Math.random();
  if (r < .35){ const w = fromDia(30 + rnd(8)); const s = downBy(w, 2, "M");
    return { prompt:`A clarinet in B♭ plays this written ${nm(w)}. Which note actually sounds?`, visual: staffSVG({clef:"treble", events:[{keys:[w], d:4}], noKeyAcc:true, minW:140}),
      options: optsFrom(nm(s), [nm(s), nm(w), nm(downBy(w,2,"m")), nm(downBy(w,3,"m")), nm(upBy(w,2,"M"))].filter((v,i,a)=>a.indexOf(v)===i), 4), answer:nm(s), explain:`B♭ instruments sound a major 2nd lower: written ${nm(w)} → sounds <b>${nm(s)}</b>.` }; }
  if (r < .65){ const c = fromDia(28 + rnd(6)); const w = upBy(c, 5, "P");
    return { prompt:`The horn in F must sound concert ${nm(c)}. Which note is written in the horn part?`, options: optsFrom(nm(w), [nm(w), nm(c), nm(downBy(c,5,"P")), nm(upBy(c,4,"P")), nm(upBy(c,2,"M"))].filter((v,i,a)=>a.indexOf(v)===i), 4), answer:nm(w),
      explain:`Horn in F sounds a perfect 5th lower, so it’s written a perfect 5th higher: <b>${nm(w)}</b>.` }; }
  const n = N(rnd(7), pick([0,0,1,-1]), 4); const ivs = [[2,"M"],[3,"m"],[3,"M"],[4,"P"],[5,"P"]]; const [num,q] = pick(ivs); const t = upBy(n, num, q);
  if (Math.abs(t.acc) > 1) return TGEN.transpose();
  return { prompt:`Transpose ${nm(n)} UP a ${intName(num,q)}.`, visual: staffSVG({clef:"treble", events:[{keys:[n], d:4}], noKeyAcc:true, minW:140}),
    options: optsFrom(nm(t), [nm(t), nm(upBy(n,num,q==="M"?"m":q==="m"?"M":"A")), nm(fromDia(diaOf(t)+1, t.acc)), nm(fromDia(diaOf(t)-1, t.acc))].filter((v,i,a)=>a.indexOf(v)===i), 4), answer:nm(t),
    explain:`Count ${num} letter names up from ${nm(n)}, then check the semitones (${semisFor(num,q)}): <b>${nm(t)}</b>.` };
};

TGEN.timeClass = (p) => {
  const sig = pick(p.sigs); const [a, b] = sig.split("/").map(Number);
  const type = [5,7].includes(a) ? "irregular" : a % 3 === 0 && a > 3 ? "compound" : "simple";
  const beats = type === "compound" ? a/3 : a;
  const word = {2:"duple",3:"triple",4:"quadruple",5:"quintuple",7:"septuple"}[beats];
  const unit = {2:"minim",4:"crotchet",8:"quaver",16:"semiquaver"}[b];
  const beatName = type === "compound" ? "dotted " + {2:"semibreve",4:"minim",8:"crotchet",16:"quaver"}[b] : unit;
  if (Math.random() < 0.35 && type !== "irregular"){
    const pool = ["minim","crotchet","quaver","dotted minim","dotted crotchet","dotted quaver"];
    return { prompt:`In ${sig}, what kind of note is one beat?`, visual:`<div style="text-align:center">${timeSigBox(sig)}</div>`, options: optsFrom(beatName, pool, 4), answer: beatName,
      explain:`${sig} is ${type} ${word}: ${beats} ${beatName} beats per bar.` };
  }
  const ans = type + " " + word;
  const pool = ["simple duple","simple triple","simple quadruple","compound duple","compound triple","compound quadruple"].concat(p.sigs.some(x => /^[57]\//.test(x)) ? ["irregular quintuple","irregular septuple"] : []);
  return { prompt:`Describe the time signature ${sig}.`, visual:`<div style="text-align:center">${timeSigBox(sig)}</div>`, options: optsFrom(ans, pool, 4), answer: ans,
    explain:`<b>${ans}</b>: ${beats} ${type==="irregular"?unit:beatName} beats in a bar${type==="compound"?", each splitting into three":type==="simple"?", each splitting into two":", grouped unevenly (e.g. "+(a===5?"3+2":"2+2+3")+")"}.` };
};
const timeSigBox = sig => `<svg viewBox="0 0 60 135" style="width:60px;max-width:100%" aria-label="time signature ${sig}">${[0,1,2,3,4].map(i => `<line class="st" stroke-width="1.1" x1="4" x2="56" y1="${45+i*10}" y2="${45+i*10}"/>`).join("")}${timeSigSVG(sig, 21, 45)}</svg>`;
</script>
<script>
/* ===================== state & storage ===================== */
const KEY = "cadenza-ear-studio-v1";
function mkPlayer(name, o={}){ return Object.assign({ id:"p"+Math.random().toString(36).slice(2,8), name, inst:["your instrument"], clef:"treble", theoryStart:1, auralStart:3,
  xp:0, days:{}, sk:{}, tl:{}, badges:{}, gym:{n:0, best:0}, mocks:{}, flash:{}, total:{a:0, c:0}, termsRight:0, away:0, lastAway:null, unlockAll:false }, o); }
function defaultState(){ return { v:1, t:0, cur:0, players:[
  mkPlayer("Philip", {id:"philip", inst:["violin","double bass"], theoryStart:5, auralStart:4, clef:"treble"}),
  mkPlayer("Faye", {id:"faye", inst:["flute","cello"], theoryStart:1, auralStart:3, clef:"treble"}) ] }; }
const STORE = { db:null, uid:null };
let STATE = defaultState();
function loadLocal(){ try { const r = localStorage.getItem(KEY); if (r) STATE = Object.assign(defaultState(), JSON.parse(r)); } catch(e){} }
let pushT = 0;
function save(){ STATE.t = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(STATE)); } catch(e){}
  if (STORE.db){ clearTimeout(pushT); pushT = setTimeout(() => { try { STORE.db.collection("data/users/" + STORE.uid).doc("state").set({ j: JSON.stringify(STATE), t: STATE.t }).catch(()=>{}); } catch(e){} }, 1500); } }
async function syncInit(){ try { if (!window.claude || !window.claude.use) return;
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); if (!db || !user) return;
  const uid = await user.id(); if (!uid) return; STORE.db = db; STORE.uid = uid;
  let d = null; const col = db.collection("data/users/" + uid);
  if (col.doc && typeof col.doc("state").get === "function"){ const snap = await col.doc("state").get(); d = snap && (typeof snap.data === "function" ? snap.data() : snap); }
  else if (typeof col.get === "function"){ const snap = await col.get(); const docs = (snap && (snap.docs || snap)) || []; const f = Array.from(docs).find(x => x && x.id === "state"); d = f ? (typeof f.data === "function" ? f.data() : (f.data || f)) : null; }
  if (d && d.j && (d.t || 0) > (STATE.t || 0)){ STATE = Object.assign(defaultState(), JSON.parse(d.j)); fixState(); render(); } else save();
} catch(e){} }
function fixState(){ if (!Array.isArray(STATE.players) || !STATE.players.length) STATE.players = defaultState().players;
  STATE.players = STATE.players.map(p => Object.assign(mkPlayer(p.name || "Player"), p)); if (!(STATE.cur >= 0 && STATE.cur < STATE.players.length)) STATE.cur = 0; }
const P = () => STATE.players[STATE.cur];

/* ===================== progress helpers ===================== */
function sk(p, id){ return p.sk[id] || (p.sk[id] = {a:0, c:0, diff:.3, lv:{}, hist:[]}); }
function tl(p, id){ return p.tl[id] || (p.tl[id] = {a:0, c:0, diff:.3, stars:0}); }
function lvlStars(p, id, L){ const s = p.sk[id]; return s && s.lv[L] || 0; }
function auralOpen(p, id, L){ if (p.unlockAll || L <= (p.auralStart||3)) return true; return lvlStars(p, id, L-1) >= 1; }
function topLevel(p, id){ const n = AURAL_BY[id].levels.length; let t = 1; for (let L=1; L<=n; L++) if (auralOpen(p, id, L)) t = L; return t; }
function gradeOpen(p, g){ if (p.unlockAll || g <= (p.theoryStart||1)) return true; const ls = LESSONS.filter(l => l.g === g-1); const done = ls.filter(l => (p.tl[l.id]||{}).stars >= 1).length; return done/ls.length >= 0.6; }
function streak(p){ let d = new Date(); let n = 0; if (!p.days[todayStr(d)]) d.setDate(d.getDate()-1); while (p.days[todayStr(d)]){ n++; d.setDate(d.getDate()-1); } return n; }
function starsTotal(p){ let s = 0; Object.values(p.sk).forEach(x => Object.values(x.lv||{}).forEach(v => s += v)); Object.values(p.tl).forEach(x => s += x.stars||0); return s; }
const GOAL = 20;
const today = p => p.days[todayStr()] || {q:0, c:0};
function acc(x){ return x && x.a ? x.c/x.a : null; }
function topicAcc(p, topic){ let a=0, c=0; LESSONS.filter(l => l.topic === topic).forEach(l => { const t = p.tl[l.id]; if (t){ a += t.a; c += t.c; } }); return a ? {a, c} : null; }

const BADGES = [
 {id:"first", n:"First notes", d:"Answer your first question", t:p => p.total.a >= 1},
 {id:"c25", n:"Warming up", d:"25 correct answers", t:p => p.total.c >= 25},
 {id:"c100", n:"Century", d:"100 correct answers", t:p => p.total.c >= 100},
 {id:"c500", n:"Golden ears", d:"500 correct answers", t:p => p.total.c >= 500},
 {id:"s3", n:"Three in a row", d:"3-day practice streak", t:p => streak(p) >= 3},
 {id:"s7", n:"Week of listening", d:"7-day streak", t:p => streak(p) >= 7},
 {id:"s30", n:"Practice habit", d:"30-day streak", t:p => streak(p) >= 30},
 {id:"star3", n:"Three-star round", d:"Get 3 stars on any level", t:p => Object.values(p.sk).some(s => Object.values(s.lv).some(v => v >= 3)) || Object.values(p.tl).some(t => t.stars >= 3)},
 {id:"intAce", n:"Interval ace", d:"85% on 30+ intervals", t:p => { const s = p.sk.intervals; return s && s.a >= 30 && s.c/s.a >= .85; }},
 {id:"rhythm", n:"Rhythm machine", d:"3 stars in clap-back", t:p => { const s = p.sk.clap; return s && Object.values(s.lv).some(v => v >= 3); }},
 {id:"cad", n:"Full stop!", d:"20 cadences right", t:p => (p.sk.cadences||{c:0}).c >= 20},
 {id:"mod", n:"Key traveller", d:"15 modulations right", t:p => (p.sk.modulation||{c:0}).c >= 15},
 {id:"g1", n:"Grade 1 theory", d:"Star every Grade 1 lesson", t:p => LESSONS.filter(l=>l.g===1).every(l => (p.tl[l.id]||{}).stars >= 1)},
 {id:"g3", n:"Grade 3 theory", d:"Star every Grade 3 lesson", t:p => LESSONS.filter(l=>l.g===3).every(l => (p.tl[l.id]||{}).stars >= 1)},
 {id:"g5", n:"Grade 5 ready", d:"Star every Grade 5 lesson", t:p => LESSONS.filter(l=>l.g===5).every(l => (p.tl[l.id]||{}).stars >= 1)},
 {id:"terms", n:"Polyglot", d:"60 terms answered right", t:p => p.termsRight >= 60},
 {id:"gym1", n:"Into the gym", d:"Finish an Ear Gym session", t:p => p.gym.n >= 1},
 {id:"gym10", n:"Gym regular", d:"10 Ear Gym sessions", t:p => p.gym.n >= 10},
 {id:"away", n:"Off the screen", d:"Do 5 practise-away tasks", t:p => p.away >= 5},
 {id:"mock", n:"Exam rehearsal", d:"Finish a Grade 6–8 mock aural", t:p => Object.keys(p.mocks||{}).length >= 1},
 {id:"chords", n:"Chord detective", d:"30 cadence-chord questions right", t:p => (p.sk.cadchords||{c:0}).c >= 30},
 {id:"goal5", n:"Goal getter", d:"Hit the daily goal on 5 days", t:p => Object.values(p.days).filter(d => d.q >= GOAL).length >= 5}
];
function checkBadges(p){ const got = []; BADGES.forEach(b => { if (!p.badges[b.id] && b.t(p)){ p.badges[b.id] = todayStr(); got.push(b); } }); if (got.length){ toast("New badge: " + got.map(b => b.n).join(", ")); confetti(); } return got; }
function record(kind, id, val, meta){
  const p = P(); const s = kind === "a" ? sk(p, id) : tl(p, id);
  s.a++; s.c += val; s.diff = clamp(s.diff + (val >= 1 ? .07 : val > 0 ? 0 : -.12), 0, 1);
  if (kind === "a"){ s.hist = (s.hist||[]).concat([val]).slice(-30); }
  p.total.a++; p.total.c += val; p.xp += val >= 1 ? (kind === "a" ? 2 : 1) : val > 0 ? 1 : 0;
  const d = p.days[todayStr()] || (p.days[todayStr()] = {q:0, c:0}); const before = d.q; d.q++; d.c += val;
  if (meta && meta.term && val >= 1) p.termsRight++;
  if (before < GOAL && d.q >= GOAL){ toast("Daily goal reached — brilliant!"); confetti(); }
  checkBadges(p); save(); renderPlayers();
}

/* ===================== UI basics ===================== */

/* ===================== Rounds ===================== */
const GYM_SKILLS = ["intervals","triads","cadences","majmin","pulse","modulation","changed","clap"];
function startRound(src, id, level){
  audioInit(); stopAll();
  const p = P(); let total = 8;
  if (src === "aural") total = AURAL_BY[id].perRound || 10;
  const queue = src === "mock" ? mockQueue(id) : null; if (queue) total = queue.length;
  VIEW.round = { src, id, level, queue, total: src === "gym" ? 999 : total, i:0, res:[], q:null, done:false, endAt: src==="gym" ? Date.now()+5*60*1000 : 0, gymLog:[] };

}
function pickGymSkill(){
  const p = P(); const R = VIEW.round; const last = R.gymLog.length ? R.gymLog[R.gymLog.length-1] : null;
  const w = GYM_SKILLS.filter(id => id !== last).map(id => { const s = p.sk[id]; const a = s && s.a >= 5 ? s.c/s.a : .5; return [id, (1-a) + .15 + (s && s.a >= 5 ? 0 : .25)]; });
  let r = Math.random() * w.reduce((u,x) => u + x[1], 0); for (const [id, x] of w){ r -= x; if (r <= 0) return id; } return w[0][0];
}
function nextQ(){
  const R = VIEW.round; if (!R) return; const p = P();
  if (R.src === "gym" && Date.now() >= R.endAt){ return endRound(); }
  if (R.src !== "gym" && R.i >= R.total) return endRound();
  let q, tries = 0;
  while (!q && tries < 8){ tries++; try {
    if (R.src === "theory"){ const l = LESSON_BY[R.id]; q = TGEN[l.gen](l.p, tl(p, l.id).diff); }
    else if (R.src === "mock"){ const it = R.queue[R.i]; q = AGEN[it.id](it.L, sk(p, it.id).diff, p); q.skill = it.id; q.L = it.L; q.sec = it.sec; q.secT = it.t; }
    else { const id = R.src === "gym" ? pickGymSkill() : R.id; const L = R.src === "gym" ? Math.max(1, topLevel(p, id) - (Math.random()<.3?1:0)) : R.level; q = AGEN[id](L, sk(p, id).diff, p); q.skill = id; q.L = L; }
  } catch(e){ console.warn(e); q = null; } }
  if (!q){ toast("Couldn’t make a question — skipping."); return endRound(); }
  q.type = q.type || "mc"; R.q = q; R.answered = false; R.taps = []; R.sel = new Set(); R.clapState = "listen"; R.played = false;
  if (R.src === "gym") R.gymLog.push(q.skill);
  paintRound();
  if (q.play && R.src !== "theory"){ setTimeout(() => { if (VIEW.round && VIEW.round.q === q) doPlay(); }, 350); }
}
function doPlay(){
  const R = VIEW.round; if (!R || !R.q || !R.q.play) return; const secs = R.q.play() || 0; R.played = true;
  const b = $("#ex [data-act=play]"); if (b){ b.classList.add("playing"); clearTimeout(doPlay.t); doPlay.t = setTimeout(() => { b.classList.remove("playing"); onPlayEnd(); }, secs*1000); }
  else { clearTimeout(doPlay.t); doPlay.t = setTimeout(onPlayEnd, secs*1000); }
  const pad = $("#pad"); if (pad && R.q.type === "clap" && R.clapState !== "done"){ R.clapState = "listen"; pad.disabled = true; pad.textContent = "Listen…"; }
}
function onPlayEnd(){ const R = VIEW.round; if (!R || !R.q) return; if (R.q.type === "clap" && R.clapState === "listen"){ R.clapState = "tap"; const pad = $("#pad"); if (pad){ pad.disabled = false; pad.textContent = "Your turn — tap the rhythm here"; } } }
function dotsHTML(R){ if (R.src === "gym") return ""; let h = ""; for (let i=0;i<R.total;i++){ const r = R.res[i]; h += `<i class="${r==null?(i===R.i?"cur":""):r>=1?"ok":r>0?"cur":"no"}"></i>`; } return `<div class="dots" aria-label="Question ${R.i+1} of ${R.total}">${h}</div>`; }
function paintRound(){
  const ex = $("#ex"); const R = VIEW.round; if (!ex || !R) return;
  if (R.done){ ex.innerHTML = summaryHTML(); return; }
  const q = R.q; if (!q) return;
  const head = R.src === "gym" ? `<div class="gymhead"><div class="timer" id="gtimer">${fmtTime(R.endAt - Date.now())}</div><div class="muted">${esc(AURAL_BY[q.skill].name)} · level ${q.L}<br>${R.res.filter(x=>x>=1).length} right so far</div><button class="btn small ghost" data-act="quit" style="margin-left:auto">Finish early</button></div>`
    : R.src === "mock" ? `<div class="exhead"><div class="kicker">${MOCKS[R.id].t} mock · Test ${q.sec}: ${esc(q.secT)}</div>${dotsHTML(R)}<button class="btn small ghost" data-act="quit">Stop</button></div>`
    : `<div class="exhead"><div class="kicker">${R.src==="theory"?esc(LESSON_BY[R.id].t):esc(AURAL_BY[R.id].name)+" · level "+R.level}</div>${dotsHTML(R)}<button class="btn small ghost" data-act="quit">Stop</button></div>`;

function scoreClap(){
  const R = VIEW.round; const q = R.q; if (R.answered) return; R.clapState = "done";
  const spb = 60/q.bpm; const exp = q.onsets.map(o => (o - q.onsets[0]) * spb);
  const taps = R.taps.map(t => (t - R.taps[0]) / 1000);
  let best = {score:-1};
  for (let s = 0.8; s <= 1.2001; s += 0.02){
    const tol = Math.max(0.09, 0.2*spb); const used = new Set(); let hit = 0; const pairs = [];
    exp.forEach((e, i) => { let bj = -1, bd = 1e9; taps.forEach((t, j) => { if (used.has(j)) return; const d = Math.abs(t/s - e); if (d < bd){ bd = d; bj = j; } }); if (bj >= 0 && bd <= tol){ used.add(bj); hit++; pairs.push([i,bj]); } });
    const score = hit / Math.max(exp.length, taps.length);
    if (score > best.score || (score === best.score && Math.abs(s-1) < Math.abs(best.s-1))) best = {score, s, pairs};
  }
  const val = best.score >= 0.85 ? 1 : best.score >= 0.6 ? 0.5 : 0;
  const pad = $("#pad"); if (pad){ pad.disabled = true; pad.textContent = Math.round(best.score*100) + "% in time"; }
  // timeline
  const dur = Math.max(exp[exp.length-1]||0, (taps[taps.length-1]||0)/best.s) + .4; const W = 360, X = t => 46 + (t/dur)*(W-60);
  let svg = `<svg viewBox="0 0 ${W} 74" role="img" aria-label="timing chart"><text x="2" y="28" class="sf" font-size="13">notes</text><text x="2" y="59" class="sf" font-size="13">you</text>`;
  const matchedE = new Set(best.pairs.map(p=>p[0])), matchedT = new Set(best.pairs.map(p=>p[1]));
  best.pairs.forEach(([i,j]) => svg += `<line x1="${X(exp[i])}" y1="30" x2="${X(taps[j]/best.s)}" y2="46" stroke="var(--line)" stroke-width="2"/>`);
  exp.forEach((e,i) => svg += `<rect x="${X(e)-3}" y="16" width="6" height="16" rx="2" fill="${matchedE.has(i)?"var(--teal)":"var(--rose)"}"/>`);
  taps.forEach((t,j) => svg += `<circle cx="${X(t/best.s)}" cy="54" r="6" fill="${matchedT.has(j)?"var(--brass-strong)":"var(--rose)"}"/>`);
  svg += `</svg>`;
  showFeedback(val, `${taps.length} taps for ${exp.length} notes. Here’s the rhythm and your timing (bars = notes, dots = your taps; red = missed or extra):<div class="timeline notation" style="margin-top:8px">${svg}</div><div class="notation" style="margin-top:8px">${q.notation}</div>`);
}

function awayTasks(p, R){
  const inst = p.inst.length ? p.inst : ["instrument"]; const i0 = inst[0], i1 = inst[1] || inst[0];
  const low = inst.find(x => /cello|bass|bassoon|trombone|tuba/i.test(x)) || i0;
  const strings = x => /violin|viola|cello|bass/i.test(x);
  const ref = x => /violin/i.test(x) ? "open D string" : /viola|cello/i.test(x) ? "open G string" : /bass/i.test(x) ? "open D string" : /flute/i.test(x) ? "low G" : "a comfortable middle note";
  const T = [];
  const a = R.lastAway || {};
  const mk = (kind, x) => {
    switch(kind){
      case "interval": return `Sing a <b>${x.name||"perfect 5th"}</b> above your ${ref(i0)}, then find it on your ${i0}. Was your voice in tune? Try the same interval going down.`;
      case "triad": return `Play a ${x.name||"major"} arpeggio on your ${i1} starting on three different notes. Then sing just the middle note (the 3rd) — that’s what makes it major or minor.`;
      case "cadence": return `On your ${low}, play the bass of a ${x.name && x.name.includes("–") ? x.name : (x.name||"perfect")+" cadence"} in ${x.key||"C major"}${/perfect|V–I/.test(x.name||"")?" (degree 5 then 1)":/plagal|IV–I/.test(x.name||"")?" (degree 4 then 1)":/interrupted|V–VI/.test(x.name||"")?" (degree 5 then 6)":" (ending on degree 5)"}. Sing the top note while you play.`;
      case "scale": return `Play the scale of <b>${x.key||"G major"}</b> on your ${i0} (two octaves if you know it), then the ${/minor/.test(x.key||"")?"relative major":"relative minor"}. Can you hear where the semitones fall?`;
      case "pulse": return `Pick one of your exam pieces. Conduct it in ${x.name||"its time signature"} while humming the tune, then play the opening with a clear strong first beat.`;
      case "rhythm": return `Clap a rhythm from the clap-back, then play it on one note on your ${i0}, then on each note of a D major scale. Keep a metronome at 72.`;
      case "modulation": return `Find a place in one of your pieces where the key changes. Play the passage and decide: dominant, subdominant or relative key? ${x.to?`(Today you heard a move to ${x.to}.)`:""}`;
      case "melody": return `Play a five-note tune on your ${i1}. Ask someone at home to change one note while you listen with your eyes closed — can you spot it?`;
      case "sing": case "sight": return `Before you play your next piece on the ${i0}, sing the first phrase in ${x.key||"its key"}. Then play it — did your singing match?`;
      case "parts": return `Play a duet or a piece with piano with someone at home. Then swap: sing their part while they play yours. Hearing the other line is exactly what test A trains.`;
      case "style": return `Listen to one Baroque piece and one Romantic piece today (try Bach and Chopin). Write three differences you hear — sound, texture, tempo.`;
      case "features": return `Play the opening of an exam piece twice: once with exaggerated dynamics, once with exaggerated articulation. Ask someone to describe what changed.`;
      default: return `Play your favourite scale slowly on your ${i0}, listening for every semitone.`;
    }
  };
  if (a.kind) T.push(mk(a.kind, a));
  const weak = GYM_SKILLS.map(id => { const s = p.sk[id]; return [id, s && s.a ? s.c/s.a : .5]; }).sort((x,y) => x[1]-y[1])[0][0];
  const map = {intervals:"interval", triads:"triad", cadences:"cadence", majmin:"scale", pulse:"pulse", modulation:"modulation", changed:"melody", clap:"rhythm"};
  const w = mk(map[weak], {}); if (!T.includes(w)) T.push(w);
  T.push(pick([`Hum the start of your Grade 8 piece, then play it on your ${i0}. Notice where your voice wobbled — that’s the tricky interval.`,
    `Tune your ${strings(i0)?i0:i1==="cello"?"cello":i0} carefully by ear, listening to the perfect 5ths${strings(i0)||strings(i1)?" between strings":" against a drone"}.`,
    `Listen to one piece of music today without a screen and describe its dynamics, tempo and character in three sentences.`]));
  return T.slice(0, 3);
}
