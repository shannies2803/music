<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Handbook | The Theory Room</title>
<meta name="description" content="A free music theory handbook: a dictionary of every ABRSM and Trinity term, every key signature and the circle of fifths, intervals, note values, clefs and ornaments.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Music&display=swap">

<script>window.TR_ROOM = 1;</script>

<style>
  main { padding-block: 24px 60px; }
  main > .wrap { display: grid; gap: 22px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .tabs button, .chips button { font: inherit; font-size: 15px; min-height: 40px; padding: 4px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; }
  .tabs button[aria-selected="true"], .chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .panel2 { border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--sheet); padding: clamp(14px, 2.6vw, 24px); display: grid; gap: 14px; }
  input.search, select { font: inherit; font-size: 17px; min-height: 46px; padding: 6px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--page); color: var(--ink); }
  input.search { width: 100%; max-width: 520px; }
  .dict { display: grid; gap: 0; }
  .dict .letter { font-family: var(--f-display); font-size: 22px; margin: 14px 0 4px; color: var(--accent); }
  .dict .row1 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 4px 14px; padding: 8px 4px; border-top: 1px solid var(--line); align-items: baseline; }
  .dict .row1 i { font-weight: 700; }
  .dict .src { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; text-align: right; }
  @media (max-width: 640px) { .dict .row1 { grid-template-columns: 1fr; } .dict .src { text-align: left; } }
  .flash { border: 1.5px solid var(--accent); border-radius: var(--radius); padding: 22px; text-align: center; display: grid; gap: 12px; background: var(--page); }
  .flash .term { font-family: var(--f-display); font-size: clamp(28px, 5vw, 40px); font-style: italic; }
  .flash .meaning { font-size: 21px; min-height: 30px; }
  .cof { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 820px) { .cof { grid-template-columns: 1fr; } }
  .cof svg.circle { width: 100%; max-width: 460px; height: auto; display: block; margin: 0 auto; }
  .orn .tg { font-family: "Noto Music", "Segoe UI Symbol", serif; font-style: normal; font-weight: 400; font-size: 84px; text-anchor: middle; }
  .cof .seg { cursor: pointer; }
  .cof .seg circle { fill: var(--page); stroke: var(--line); stroke-width: 1.5; }
  .cof .seg:hover circle, .cof .seg.on circle { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
  .cof text { fill: var(--ink); font-family: var(--f-display); text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
  .cof text.mi { font-size: 13px; fill: var(--muted); }
  .staff line { stroke: var(--ink); stroke-width: 1.2; }
  .staff .clef, .glyph { font-family: "Noto Music", "Bravura Text", "Segoe UI Symbol", "Apple Symbols", serif; }
  .staff .clef, .staff .nh, .staff .acc { fill: var(--ink); }
  .staff .acc { font-family: "Noto Music", "Segoe UI Symbol", serif; }
  .staff .lbl { fill: var(--muted); font: 12px var(--f-mono); text-anchor: middle; }
  .staves { display: flex; flex-wrap: wrap; gap: 12px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 16px; }
  table.t th, table.t td { text-align: left; padding: 8px; border-top: 1px solid var(--line); vertical-align: middle; }
  table.t th { font-size: 13px; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-top: 0; }
  .glyph { font-size: 34px; line-height: 1; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .card2 { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--page); display: grid; gap: 8px; align-content: start; }
  .card2 h3 { margin: 0; font-size: 19px; }
  .orn svg { width: 64px; height: 40px; }
  .orn path, .orn line { stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .orn text { fill: var(--ink); font: italic 700 22px Georgia, serif; }
  .note { font-size: 14px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }

<body>
<main>
  <div class="wrap">
    <div style="display:grid;gap:10px">
      <p class="kicker">Room 6 · Handbook · free</p>
      <h1 style="font-size:clamp(34px,5.4vw,56px)">The theory handbook</h1>
      <p class="lede">Everything you keep looking up: every term on the ABRSM and Trinity lists, every key signature, intervals, chords and cadences, form and style, instrument names in scores, note values, clefs and ornaments, plus 60-second speed games. Free for everyone.</p>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <section id="view"></section>
  </div>
</main>
<script src="handbook-terms.js"></script>
<script src="instruments.js"></script>
<script src="instruments-more.js"></script>
<script src="musicianship.js"></script>
<script src="scorereading.js"></script>
<script>
(function () {
  "use strict";
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var TABS = [["dict", "Terms dictionary"], ["keys", "Keys & the circle of fifths"], ["intervals", "Intervals"], ["values", "Notes & rests"], ["clefs", "Clefs"], ["chords", "Chords & harmony"], ["style", "Form & style"], ["score", "Instruments in scores"], ["ornaments", "Ornaments"], ["games", "Speed games"]];
  var tab = (location.hash || "").slice(1) || "dict";
  if (!TABS.some(function (t) { return t[0] === tab; })) tab = "dict";

  /* ---------- notes and staves ---------- */
  var LET = "CDEFGAB", STEP = [0, 2, 4, 5, 7, 9, 11];
  var N = function (L, acc, oct) { return { L: L, acc: acc, oct: oct }; };

    (o.notes || []).forEach(function (n, i) {
      var x = x0 + i * gap + 10;
      var prevD = null, shifted = false;
      (n.ns || [n.n]).slice().sort(function (a, b2) { return dia(a) - dia(b2); }).forEach(function (nn, j) {
        var d = dia(nn) - c.ref, y = bottom - d * H / 2, x = x0 + i * gap + 10;
        if (prevD !== null && d - prevD === 1 && !shifted) { x += 13; shifted = true; } else shifted = false; prevD = d;
        for (var q = -2; q >= d; q -= 2) s += '<line x1="' + (x - 11) + '" x2="' + (x + 11) + '" y1="' + (bottom - q * H / 2) + '" y2="' + (bottom - q * H / 2) + '"/>';
        for (var r = 10; r <= d; r += 2) s += '<line x1="' + (x - 11) + '" x2="' + (x + 11) + '" y1="' + (bottom - r * H / 2) + '" y2="' + (bottom - r * H / 2) + '"/>';
        if (n.showAcc || (n.ns && nn.acc)) s += '<text class="acc" x="' + (x - 22) + '" y="' + (y + 5) + '" font-size="18">' + (ACC[nn.acc] || "♮") + "</text>";
        s += '<ellipse class="nh" cx="' + x + '" cy="' + y + '" rx="6.4" ry="4.6" transform="rotate(-20 ' + x + " " + y + ')"/>';
      });
      if (n.label) s += '<text class="lbl" x="' + x + '" y="' + ((o.h || 120) - 6) + '">' + esc(n.label) + "</text>";
    });
    return s + "</svg>";
  }

  /* ---------- sound ---------- */
  var actx = null;
  function play(ms, step, together) {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume();
    var t0 = actx.currentTime + .05;
    ms.forEach(function (m, i) {
      var t = t0 + (together ? 0 : i * step), f = 440 * Math.pow(2, (m - 69) / 12), g = actx.createGain(); g.connect(actx.destination);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + (together ? 1.6 : step * 1.6));
      [[1, 1], [2, .4], [3, .15]].forEach(function (p) { var o = actx.createOscillator(), gg = actx.createGain(); o.frequency.value = f * p[0]; gg.gain.value = p[1]; o.connect(gg); gg.connect(g); o.start(t); o.stop(t + 2); });
    });
  }

  /* ---------- 1. the dictionary ---------- */
  var HT = window.HANDBOOK_TERMS || { abrsm: [], trinity: [] }, MORE = window.INSTRUMENTS_MORE || {}, INST = window.INSTRUMENTS || [];
  var ENTRIES = [];
  HT.abrsm.forEach(function (t) { ENTRIES.push({ t: t[0], m: t[1], b: "ABRSM", g: t[2], lang: t[3] }); });
  HT.trinity.forEach(function (t) { ENTRIES.push({ t: t[0], m: t[1], b: "Trinity", g: t[2] }); });
  INST.forEach(function (x) { (MORE[x.id] ? MORE[x.id].tech : []).forEach(function (t) { ENTRIES.push({ t: t[0], m: t[1], b: "Instruments", inst: x.name }); }); });
  var fold = function (s) { return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[‘’'()]/g, ""); };
  ENTRIES.sort(function (a, b) { return fold(a.t).localeCompare(fold(b.t)); });
  var D = { q: "", b: "All", g: 0, flash: null };
  function filtered() {
    /* match every word of the search, by its stem, so ‘slowing’ also finds ‘slower’ and ‘slowly’ */
    var words = fold(D.q).split(/\s+/).filter(Boolean).map(function (w) { return w.length > 4 ? w.replace(/(ing|ly|er|ed|es|s)$/, "") : w; });
    return ENTRIES.filter(function (e) {
      if (!(D.b === "All" || e.b === D.b) || (D.g && e.g !== D.g)) return false;
      var hay = fold(e.t) + " " + fold(e.m);
      return words.every(function (w) { return hay.indexOf(w) >= 0; });
    });
  }
  function srcOf(e) { return e.b === "Instruments" ? e.inst : e.b + " Grade " + e.g + (e.lang === "Fr" ? " · French" : e.lang === "De" ? " · German" : ""); }
  function dictList() {
    var list = filtered(), last = "", h = "";
    list.forEach(function (e) { var L = fold(e.t).charAt(0).toUpperCase(); if (!/[A-Z]/.test(L)) L = "#"; if (L !== last) { h += '<div class="letter">' + L + "</div>"; last = L; } h += '<div class="row1"><i>' + esc(e.t) + "</i><span>" + esc(e.m) + '</span><span class="src">' + esc(srcOf(e)) + "</span></div>"; });
    return '<p class="muted" style="margin:0">' + list.length + " of " + ENTRIES.length + " terms</p>" + (h ? '<div class="dict">' + h + "</div>" : '<p>No terms match. Try fewer letters.</p>');
  }
  function flashHTML() {
    var F = D.flash; if (F.i >= F.deck.length) return '<div class="flash"><div class="term" style="font-style:normal">Done!</div><p>You knew ' + F.known + " of " + F.deck.length + '.</p><div><button class="btn go" type="button" data-d="flash">Another 10</button> <button class="btn" type="button" data-d="endflash">Back to the list</button></div></div>';
    var e = F.deck[F.i];
    return '<div class="flash"><span class="muted">' + (F.i + 1) + " / " + F.deck.length + " · " + esc(srcOf(e)) + '</span><div class="term">' + esc(e.t) + '</div><div class="meaning">' + (F.show ? esc(e.m) : "") + "</div>" +
      (F.show ? '<div><button class="btn" type="button" data-d="no">Not yet</button> <button class="btn go" type="button" data-d="yes">I knew it</button></div>' : '<div><button class="btn go" type="button" data-d="show">Show the meaning</button></div>') + "</div>";
  }
  function dict() {
    var grades = [0, 1, 2, 3, 4, 5, 6, 7, 8];
    return '<div class="panel2"><input class="search" id="dq" type="search" placeholder="Search a term or a meaning (e.g. ‘slowing’)" value="' + esc(D.q) + '" aria-label="Search terms">' +
      '<div class="chips">' + ["All", "ABRSM", "Trinity", "Instruments"].map(function (b) { return '<button type="button" data-db="' + b + '" aria-pressed="' + (D.b === b) + '">' + (b === "Instruments" ? "Instrument directions" : b) + "</button>"; }).join("") +
      (D.b === "ABRSM" || D.b === "Trinity" ? '<select id="dg" aria-label="Grade">' + grades.map(function (g) { return '<option value="' + g + '"' + (D.g === g ? " selected" : "") + ">" + (g ? "Grade " + g : "Every grade") + "</option>"; }).join("") + "</select>" : "") +
      '<button class="btn small go" type="button" data-d="flash" style="margin-left:auto">Test me on these (10 cards)</button></div>' +
      (D.flash ? flashHTML() : "") + '<div id="dlist">' + dictList() + "</div></div>";
  }

  /* ---------- 2. keys and the circle of fifths ---------- */
  var MAJ = { "-7": "C♭", "-6": "G♭", "-5": "D♭", "-4": "A♭", "-3": "E♭", "-2": "B♭", "-1": "F", "0": "C", "1": "G", "2": "D", "3": "A", "4": "E", "5": "B", "6": "F♯", "7": "C♯" };
  var MIN = { "-7": "A♭", "-6": "E♭", "-5": "B♭", "-4": "F", "-3": "C", "-2": "G", "-1": "D", "0": "A", "1": "E", "2": "B", "3": "F♯", "4": "C♯", "5": "G♯", "6": "D♯", "7": "A♯" };
  var CIRCLE = [[0], [1], [2], [3], [4], [5, -7], [6, -6], [-5, 7], [-4], [-3], [-2], [-1]];
  var K = { k: 0, mode: "major" };
  function sigAcc(k, L) { var sh = "FCGDAEB", fl = "BEADGCF", ch = LET[L]; if (k > 0) return sh.indexOf(ch) < k ? 1 : 0; if (k < 0) return fl.indexOf(ch) < -k ? -1 : 0; return 0; }
  function tonicOf(k, mode) { var name = (mode === "major" ? MAJ : MIN)[String(k)], L = LET.indexOf(name[0]); return N(L, name.length > 1 ? (name[1] === "♯" ? 1 : -1) : 0, 4); }
  function scale(k, mode, kind) {

    var MINL = [["Am", 0], ["Em", 1], ["Bm", 2], ["F♯m", 3], ["C♯m", 4], ["G♯m", 5], ["E♭m", -6], ["B♭m", -5], ["Fm", -4], ["Cm", -3], ["Gm", -2], ["Dm", -1]];
    CIRCLE.forEach(function (ks, i) {
      var a = (i / 12) * Math.PI * 2 - Math.PI / 2, x = cx + 158 * Math.cos(a), y = cy + 158 * Math.sin(a), xi = cx + 100 * Math.cos(a), yi = cy + 100 * Math.sin(a), on = ks.indexOf(K.k) >= 0;
      var majLbl = ks.map(function (k) { return MAJ[String(k)]; }).join("/"), minLbl = MINL[i][0], mk = MINL[i][1], onMin = K.mode === "minor" && (K.k === mk || ks.indexOf(K.k) >= 0);
      s += '<g class="seg' + (on && K.mode === "major" ? " on" : "") + '" data-k="' + ks[0] + '" data-mode="major" tabindex="0" role="button" aria-label="' + esc(majLbl) + ' major"><circle cx="' + x + '" cy="' + y + '" r="' + (ks.length > 1 ? 34 : 28) + '"/><text x="' + x + '" y="' + y + '" font-size="' + (ks.length > 1 ? 14 : 19) + '">' + esc(majLbl) + "</text></g>";
      s += '<g class="seg' + (onMin ? " on" : "") + '" data-k="' + mk + '" data-mode="minor" tabindex="0" role="button" aria-label="' + esc(minLbl.replace("m", " minor")) + '"><circle cx="' + xi + '" cy="' + yi + '" r="23"/><text class="mi" x="' + xi + '" y="' + yi + '">' + esc(minLbl) + "</text></g>";
    });
    return s + '<text x="200" y="192" font-size="13" class="mi">majors outside</text><text x="200" y="210" font-size="13" class="mi">minors inside</text></svg>';
  }
  function keys() {
    var k = K.k, mode = K.mode, name = (mode === "major" ? MAJ : MIN)[String(k)] + " " + mode, rel = mode === "major" ? MIN[String(k)] + " minor" : MAJ[String(k)] + " major";
    var n = Math.abs(k), list = k > 0 ? "FCGDAEB".slice(0, k).split("").map(function (c) { return c + "♯"; }) : "BEADGCF".slice(0, -k).split("").map(function (c) { return c + "♭"; });
    var enh = Math.abs(k) >= 5 ? (mode === "major" ? MAJ : MIN)[String(k > 0 ? k - 12 : k + 12)] : null;
    var scales = mode === "major" ? [["Major scale", scale(k, mode)]] : [["Natural minor", scale(k, mode, "natural")], ["Harmonic minor (raised 7th)", scale(k, mode, "harmonic")], ["Melodic minor going up (raised 6th and 7th)", scale(k, mode, "melodic")]];
    return '<div class="panel2"><div class="cof"><div>' + circleSVG() + '<p class="note">Going clockwise, each key is a 5th higher and adds a sharp (or loses a flat). The inner ring shows each relative minor, which shares the key signature.</p></div>' +
      '<div style="display:grid;gap:12px"><h2 style="margin:0;font-size:32px">' + esc(name) + "</h2><p style=\"margin:0\">" + (n ? n + " " + (k > 0 ? "sharp" : "flat") + (n > 1 ? "s" : "") + ": <b>" + list.join(" ") + "</b>" : "No sharps or flats.") + "<br>Relative " + (mode === "major" ? "minor" : "major") + ": <b>" + esc(rel) + "</b>" + (enh && Math.abs(k > 0 ? k - 12 : k + 12) <= 7 ? "<br>Sounds the same as: <b>" + esc(enh + " " + mode) + "</b> (enharmonic)" : "") + "</p>" +
      '<div class="staves">' + stave({ clef: "treble", k: k, label: "key signature, treble clef" }) + stave({ clef: "bass", k: k, label: "key signature, bass clef" }) + stave({ clef: "alto", k: k, label: "key signature, alto clef" }) + "</div>" +
      scales.map(function (sc, i) { var notes = sc[1]; return "<div><b>" + esc(sc[0]) + '</b><div style="overflow-x:auto">' + stave({ clef: "treble", k: k, notes: notes.map(function (x, j) { return { n: x, label: nm(x), showAcc: x.acc !== sigAcc(k, x.L) }; }), gap: 36, h: 130, label: sc[0] }) + '</div><button class="btn small" type="button" data-scale="' + i + '">▶ Hear it</button></div>'; }).join("") +
      '<div class="chips"><button type="button" data-mode="major" aria-pressed="' + (mode === "major") + '">Major</button><button type="button" data-mode="minor" aria-pressed="' + (mode === "minor") + '">Minor</button></div></div></div></div>';

    if ((b = e.target.closest("[data-cad]"))) { var cd = CADS[+b.dataset.cad][3]; play(cd[0].map(function (x) { return midi(parse(x)); }), 0, true); setTimeout(function () { play(cd[1].map(function (x) { return midi(parse(x)); }), 0, true); }, 1100); return; }
    if ((b = e.target.closest("[data-db]"))) { D.b = b.dataset.db; D.g = 0; D.flash = null; render(); return; }
    if ((b = e.target.closest("[data-d]"))) {
      var a = b.dataset.d, F = D.flash;
      if (a === "flash") { var pool = filtered(); for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = pool[i]; pool[i] = pool[j]; pool[j] = t; } D.flash = { deck: pool.slice(0, 10), i: 0, show: false, known: 0 }; }
      if (a === "endflash") D.flash = null;
      if (a === "show") F.show = true;
      if (a === "yes" || a === "no") { if (a === "yes") F.known++; F.i++; F.show = false; }
      render(); return;
    }
    if ((b = e.target.closest(".seg"))) { K.k = +b.dataset.k; K.mode = b.dataset.mode; render(); return; }
    if ((b = e.target.closest("[data-mode]"))) { K.mode = b.dataset.mode; render(); return; }
    if ((b = e.target.closest("[data-scale]"))) { var mode = K.mode, kinds = mode === "major" ? [null] : ["natural", "harmonic", "melodic"], sc = scale(K.k, mode, kinds[+b.dataset.scale]); play(sc.map(midi).concat(sc.slice(0, 7).reverse().map(midi)), .32); return; }
    if ((b = e.target.closest("[data-iv]"))) { var v = IV[+b.dataset.iv]; play([60, midi(parse(v[1]))], .55); setTimeout(function () { play([60, midi(parse(v[1]))], 0, true); }, 1300); return; }
  });
  document.addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest(".seg")) { e.preventDefault(); e.target.closest(".seg").dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
  document.addEventListener("input", function (e) { if (e.target.id === "dq") { D.q = e.target.value; D.flash = null; document.getElementById("dlist").innerHTML = dictList(); } });
  document.addEventListener("change", function (e) { if (e.target.id === "dg") { D.g = +e.target.value; D.flash = null; render(); } });
  window.HANDBOOK = { entries: ENTRIES, scale: scale, sigAcc: sigAcc, parse: parse, midi: midi, nm: nm, stave: stave, makeQ: makeQ };
  render();
})();
