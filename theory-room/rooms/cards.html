<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instrument card game | The Theory Room</title>
<meta name="description" content="A printable card game: 22 instrument cards for Range Trumps and Orchestra Families, 18 question cards, card backs and rules.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,650;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root { color-scheme: light; --ink: #16181d; --muted: #5b6070; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e6df; color: var(--ink); font-family: "Atkinson Hyperlegible", system-ui, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 16px; background: #16181d; color: #fff; }
  .bar a { color: #9fe3d8; }
  .bar button { font: 700 15px system-ui; padding: 9px 16px; border-radius: 10px; border: 0; background: #fff; color: #16181d; cursor: pointer; }
  .bar label { display: flex; gap: 6px; align-items: center; font-size: 15px; }
  .intro { max-width: 760px; margin: 18px auto; padding: 0 16px; line-height: 1.5; }
  .sheet { width: 210mm; height: 297mm; margin: 12px auto; background: #fff; padding: 16.5mm 10.5mm; display: grid; grid-template-columns: repeat(3, 63mm); grid-auto-rows: 88mm; gap: 0; align-content: start; justify-content: center; box-shadow: 0 2px 10px rgba(0,0,0,.15); break-after: page; page-break-after: always; }
  .sheet.rules { display: block; padding: 18mm 20mm; font-size: 11.5pt; line-height: 1.45; }
  .rules h1 { font-family: "Bricolage Grotesque", sans-serif; font-size: 24pt; margin: 0 0 4mm; }
  .rules h2 { font-family: "Bricolage Grotesque", sans-serif; font-size: 14pt; margin: 6mm 0 2mm; }
  .rules p, .rules li { margin: 1.5mm 0; }
  .card { width: 63mm; height: 88mm; border: .3mm dashed #b9b4aa; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .card .in { margin: 2.5mm; flex: 1; border-radius: 3mm; border: .6mm solid var(--c); display: flex; flex-direction: column; overflow: hidden; }
  .card .top { background: var(--c); color: #fff; padding: 2.2mm 3mm 2mm; }
  .card .fam { font: 500 6.5pt "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; opacity: .92; }
  .card .nm { font: 700 15pt/1.05 "Bricolage Grotesque", sans-serif; margin-top: .6mm; }
  .card .how { font-size: 7.2pt; line-height: 1.3; padding: 2mm 3mm 1mm; color: #333; }
  .card table { width: calc(100% - 6mm); margin: auto 3mm 1.5mm; border-collapse: collapse; font-size: 8.4pt; }
  .card td { padding: 1.1mm 0; border-top: .25mm solid #ddd; }
  .card td:last-child { text-align: right; font-weight: 700; }
  .card .foot { font: 500 5.6pt "IBM Plex Mono", monospace; color: var(--muted); padding: 0 3mm 2mm; display: flex; justify-content: space-between; }
  .rangebar { margin: 0 3mm 1.5mm; height: 3.2mm; background: #eee; border-radius: 2mm; position: relative; }
  .rangebar i { position: absolute; top: 0; bottom: 0; border-radius: 2mm; background: var(--c); }
  .qcard .in { border-color: #16181d; }
  .qcard .top { background: #16181d; }
  .qcard .q { font: 700 11pt/1.3 "Bricolage Grotesque", sans-serif; padding: 4mm 3.5mm 2mm; }
  .qcard ol { margin: 0; padding: 0 3.5mm 0 8mm; font-size: 9pt; line-height: 1.5; }
  .qcard .ans { margin-top: auto; transform: rotate(180deg); font-size: 8pt; padding: 2.5mm 3.5mm; border-top: .25mm dashed #bbb; color: #333; }
  .rcard .in { border-color: #16181d; padding: 3mm; font-size: 7.6pt; line-height: 1.35; }
  .rcard b.t { font: 700 11pt "Bricolage Grotesque", sans-serif; display: block; margin-bottom: 1.5mm; }
  .back .in { border: 0; margin: 2.5mm; border-radius: 3mm; background: #16181d; color: #fff; display: grid; place-content: center; text-align: center; position: relative; }
  .back .in::before { content: ""; position: absolute; inset: 4mm; border: .5mm solid rgba(255,255,255,.35); border-radius: 2mm; }
  .back .lines { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); height: 14mm; background: repeating-linear-gradient(#16181d 0 2.2mm, rgba(255,255,255,.18) 2.2mm 2.6mm); }
  .back b { position: relative; font: 700 15pt "Bricolage Grotesque", sans-serif; background: #16181d; padding: 1mm 3mm; }
  .back span { position: relative; font: 500 6.5pt "IBM Plex Mono", monospace; letter-spacing: .1em; margin-top: 2mm; }
  @media screen and (max-width: 820px) { .sheet { transform-origin: top left; zoom: .45; } }
  @media print { body { background: #fff; } .bar, .intro { display: none; } .sheet { margin: 0; box-shadow: none; } @page { size: A4; margin: 0; } }
</style>
</head>
<body>
<div class="bar"><button type="button" onclick="window.print()">Print or save as PDF</button>
  <label><input type="checkbox" id="optQ" checked> Question cards</label><label><input type="checkbox" id="optB" checked> Card backs</label><label><input type="checkbox" id="optR" checked> Rules page</label>
  <a href="instruments.html">← Instruments room</a></div>
<div class="intro"><h1 style="font-family:'Bricolage Grotesque',sans-serif;margin:0 0 6px">Instrument card game</h1>
  <p>Print on A4 card (250–300 gsm is best) at <b>100% scale</b> (not "fit to page"), then cut along the dashed lines. Each card is 63 × 88 mm, the size of a standard playing card. For the backs, print the backs page on the reverse of each card sheet.</p></div>
<div id="deck"></div>
<script src="instruments.js"></script>
<script src="instruments-stats.js"></script>
<script>
(function () {
  "use strict";
  var I = window.INSTRUMENTS, ST = window.INSTRUMENT_STATS || {};
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var COL = { Strings: "#9a4b1c", Woodwind: "#1f7a52", Brass: "#a67a0c", Keyboard: "#33449a", Percussion: "#a83a3a", Voice: "#6b3fa0" };
  var LET = "CDEFGAB", STEP = [0, 2, 4, 5, 7, 9, 11];
  function parse(s) { var m = /^([A-G])(#|b)?(-?\d)$/.exec(s); return { L: LET.indexOf(m[1]), acc: m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0, oct: +m[3] }; }
  var midi = function (n) { return 12 * (n.oct + 1) + STEP[n.L] + n.acc; };
  function spell(m) { var pc = ((m % 12) + 12) % 12, o = Math.floor(m / 12) - 1, sh = [0, 1, 1, 2, 2, 3, 4, 4, 5, 5, 6, 6][pc], acc = pc - STEP[sh]; return LET[sh] + (acc > 0 ? "♯" : acc < 0 ? "♭" : "") + o; }
  function stats(x) {
    var lo = midi(parse(x.low)) + x.sounds, hi = midi(parse(x.high)) + x.sounds;
    return { lo: lo, hi: hi, range: hi - lo, pieces: (ST[x.id] || {}).n || 0, clefs: x.clefs.length };
  }
  function short(s, n) { s = String(s); if (s.length <= n) return s; var cut = s.slice(0, n), i = cut.lastIndexOf(" "); return cut.slice(0, i > 40 ? i : n) + "…"; }

  /* ---------- the cards ---------- */
  function instCard(x) {
    var s = stats(x), c = COL[x.family] || "#444", left = (s.lo - 21) / 87 * 100, w = Math.max(3, s.range / 87 * 100);
    return '<div class="card" style="--c:' + c + '"><div class="in"><div class="top"><div class="fam">' + esc(x.family) + '</div><div class="nm">' + esc(x.name) + "</div></div>" +
      '<div class="how">' + esc(short(x.how, 200)) + "</div>" +
      '<div class="rangebar" title="Range across the piano keyboard"><i style="left:' + left.toFixed(1) + "%;width:" + Math.min(100 - left, w).toFixed(1) + '%"></i></div>' +
      '<div class="how" style="color:#555;padding-top:0"><b style="color:var(--c)">Did you know?</b> ' + esc(short(x.facts[0], 120)) + "</div>" +
      "<table><tr><td>Range (semitones)</td><td>" + s.range + "</td></tr><tr><td>Lowest note (sounding)</td><td>" + spell(s.lo) + "</td></tr><tr><td>Exam pieces</td><td>" + s.pieces.toLocaleString() + "</td></tr><tr><td>Clefs it reads</td><td>" + s.clefs + "</td></tr><tr><td>Transposes?</td><td>" + (x.sounds ? "Yes" : "No") + "</td></tr></table>" +
      '<div class="foot"><span>THE THEORY ROOM</span><span>' + esc(x.clefs.join(" · ")) + "</span></div></div></div>";
  }
  var RULES = [
    ["Range Trumps", "2–4 players. Deal all the instrument cards face down. Everyone turns over their top card. The leader picks a line and reads it out; the best number wins (for <b>Lowest note</b>, the lowest note wins). The winner takes the cards and leads next."],
    ["Orchestra Families", "3–5 players. Deal all the instrument cards. On your turn, ask one player for a named instrument from a family you already hold. Got it? Ask again. Lay down a family when you have it all."],
    ["Quick Quiz", "Shuffle the question cards. Read one to the player on your left; the answer is printed upside down. A right answer keeps the card. Most cards wins."],
    ["Families in the deck", "Strings 6 · Woodwind 6 · Brass 5 · Keyboard 3 · Percussion 1 · Voice 1. The timpani and the voice are wild in Orchestra Families: they can join any family."],
    ["Cutting tip", "Print at 100% scale on thin card. Cut the long lines first, then the short ones. Round the corners with a corner punch for a shop-bought feel."]
  ];
  function ruleCard(r) { return '<div class="card rcard"><div class="in"><b class="t">' + r[0] + "</b>" + r[1] + "</div></div>"; }
  function questions() {
    var out = [], fam = ["Strings", "Woodwind", "Brass", "Keyboard", "Percussion"];
    I.forEach(function (x) { out.push({ q: x.quiz.q, o: x.quiz.options, a: x.quiz.answer }); });
    out.push({ q: "Which family does the saxophone belong to?", o: ["Brass", "Woodwind", "Percussion"], a: 1 });
    out.push({ q: "Which two of these use a double reed?", o: ["Oboe and bassoon", "Clarinet and saxophone", "Flute and recorder"], a: 0 });
    out.push({ q: "Which instrument sounds an octave LOWER than written?", o: ["Flute", "Guitar", "Violin"], a: 1 });
    return out.slice(0, 18);
  }
  function qCard(q, n) {
    return '<div class="card qcard"><div class="in"><div class="top"><div class="fam">Question card ' + n + '</div><div class="nm">Quick quiz</div></div><div class="q">' + esc(q.q) + "</div><ol type=\"A\">" + q.o.map(function (o) { return "<li>" + esc(o) + "</li>"; }).join("") + '</ol><div class="ans">Answer: <b>' + String.fromCharCode(65 + q.a) + ". " + esc(q.o[q.a]) + "</b></div></div></div>";
  }
  function backCard() { return '<div class="card back"><div class="in"><div class="lines"></div><b>The Theory Room</b><span>INSTRUMENT CARDS</span></div></div>'; }
  function sheets(cards) { var out = ""; for (var i = 0; i < cards.length; i += 9) out += '<div class="sheet">' + cards.slice(i, i + 9).join("") + "</div>"; return out; }
  function rulesPage() {
    return '<div class="sheet rules"><h1>The Theory Room · Instrument cards</h1><p>22 instrument cards, 5 rule cards and 18 question cards. Each instrument card shows its family, how it makes its sound, where its notes sit on the piano keyboard (the coloured bar), and five numbers to play with.</p>' +
      "<h2>Range Trumps (2–4 players, 10–15 minutes)</h2><ol><li>Shuffle the 22 instrument cards and deal them all out, face down. Everyone holds their pile.</li><li>Everyone turns over their top card. The leader chooses one line, such as <b>Exam pieces</b>, and reads out their number.</li><li>Everyone else reads out the same line. The best number wins: highest for <b>Range</b>, <b>Exam pieces</b> and <b>Clefs</b>; lowest for <b>Lowest note</b> (A0 beats E2). For <b>Transposes?</b>, Yes beats No.</li><li>The winner takes all the cards in that round, puts them at the bottom of their pile, and leads next. A tie: leave the cards in the middle; the next winner takes them too.</li><li>Win by collecting every card, or have the most when the timer goes off.</li></ol>" +
      "<h2>Orchestra Families (3–5 players)</h2><ol><li>Deal all the instrument cards. Families: Strings (6), Woodwind (6), Brass (5), Keyboard (3). The timpani and the voice are wild: they can join any family.</li><li>On your turn, ask any player for one instrument by name, from a family you already hold (‘Have you got the oboe?’). If they have it, they give it to you and you ask again. If not, it's their turn.</li><li>When you hold a whole family, lay it down. Most families wins.</li></ol>" +
      "<h2>Quick Quiz (any number)</h2><p>Shuffle the question cards and take turns reading one to the next player. The answer is printed upside down at the bottom. Keep the cards you get right; most cards wins. Try it with Range Trumps: before you take a pile, answer a question card.</p>" +
      "<h2>Learn while you play</h2><ul><li>Which instruments transpose, and why? (Look them up in the Instruments room.)</li><li>Find each instrument's range on a piano keyboard using the coloured bar.</li><li>Sort the deck by clef: treble, alto, tenor, bass.</li></ul>" +
      '<p style="margin-top:8mm;font-size:9pt;color:#555">The Theory Room. Exam numbers count pieces on the current ABRSM and Trinity lists in the repertoire guide. Not affiliated with ABRSM or Trinity College London.</p></div>';
  }
  function render() {
    var cards = I.map(instCard).concat(RULES.map(ruleCard)), q = questions().map(function (x, i) { return qCard(x, i + 1); });
    var h = "";
    if (document.getElementById("optR").checked) h += rulesPage();
    h += sheets(cards);
    if (document.getElementById("optQ").checked) h += sheets(q);
    if (document.getElementById("optB").checked) { var backs = []; for (var i = 0; i < 9; i++) backs.push(backCard()); h += sheets(backs); }
    document.getElementById("deck").innerHTML = h;
  }
  ["optQ", "optB", "optR"].forEach(function (id) { document.getElementById(id).addEventListener("change", render); });
  window.CARDS = { stats: stats, questions: questions };
  render();
})();
</script>
</body>
</html>
