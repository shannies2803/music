function gymView(){
  const p = P(); const R = VIEW.round && VIEW.round.src === "gym" ? VIEW.round : null;
  if (R) return `<h2 style="margin-top:18px">Daily Ear Gym</h2><div id="ex"></div>`;
  const rows = GYM_SKILLS.map(id => { const s = p.sk[id]; const a = s && s.a ? s.c/s.a : null; return [id, a, s ? s.a : 0]; }).sort((x,y) => (x[1]==null?.5:x[1]) - (y[1]==null?.5:y[1]));
  return `<h2 style="margin-top:18px">Daily Ear Gym</h2>
  <div class="cols2"><div class="panel"><div class="kicker">5-minute mixed workout</div><h3>Tuned to ${esc(p.name)}’s weakest skills</h3>
   <p>Questions come from all the auto-marked aural skills, weighted towards the ones you find hardest, at the highest level you’ve unlocked. Finish with a real task for your ${esc(p.inst.join(" or "))}.</p>
   <button class="btn primary" data-act="gymStart" style="min-height:56px;font-size:1.1rem">Start 5 minutes</button>
   <p class="muted" style="margin-bottom:0">Sessions done: ${p.gym.n} · best score: ${p.gym.best}</p></div>
   <div class="panel"><div class="kicker">Focus list</div>${rows.map(([id,a,n]) => `<div class="barrow"><span>${esc(AURAL_BY[id].name)}</span><div class="bar"><i class="${a==null?"":a<.6?"lo":a<.8?"mid":""}" style="width:${a==null?4:Math.round(a*100)}%"></i></div><span class="muted" style="font-size:.85rem">${a==null?"new":Math.round(a*100)+"%"}</span></div>`).join("")}</div></div>
  ${p.lastAway ? awayCardHTML(p.lastAway) : awayCardHTML(awayTasks(p, {}))}`;
}

/* ===================== Progress ===================== */
function progressView(){
  const p = P(); const t = today(p);
  const days = []; for (let i=13;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); const k = todayStr(d); days.push([k, (p.days[k]||{q:0}).q, d]); }
  const mx = Math.max(GOAL, ...days.map(d => d[1]));
  const chart = `<svg viewBox="0 0 420 130" style="width:100%;max-width:640px" role="img" aria-label="Questions per day, last 14 days"><line x1="0" x2="420" y1="${100-80*GOAL/mx}" y2="${100-80*GOAL/mx}" stroke="var(--brass-strong)" stroke-dasharray="4 4"/><text x="416" y="${96-80*GOAL/mx}" text-anchor="end" class="sf" font-size="10">goal</text>${days.map((d,i) => `<rect x="${i*30+4}" y="${100-80*d[1]/mx}" width="22" height="${Math.max(1,80*d[1]/mx)}" rx="4" fill="${d[1]>=GOAL?"var(--teal)":"var(--muted)"}" opacity="${d[1]?1:.25}"><title>${d[0]}: ${d[1]}</title></rect><text x="${i*30+15}" y="118" text-anchor="middle" class="sf" font-size="10">${"SMTWTFS"[d[2].getDay()]}</text>`).join("")}</svg>`;
  const bar = (label, x) => { const a = x && x.a ? x.c/x.a : null; return `<div class="barrow"><span>${esc(label)}</span><div class="bar"><i class="${a==null?"":a<.6?"lo":a<.8?"mid":""}" style="width:${a==null?0:Math.round(a*100)}%"></i></div><span class="muted" style="font-size:.85rem">${a==null?"—":Math.round(a*100)+"% <small>("+Math.round(x.a)+")</small>"}</span></div>`; };
  const ed = VIEW.edit;
  return `<h2 style="margin-top:18px">${esc(p.name)}’s progress</h2>
  <div class="statgrid"><div class="stat"><b>${p.xp}</b><span>XP earned</span></div><div class="stat"><b>${streak(p)}</b><span>day streak</span></div><div class="stat"><b>${starsTotal(p)}</b><span>stars</span></div><div class="stat"><b>${Math.min(t.q,GOAL)}/${GOAL}</b><span>today’s goal</span></div></div>
  <div class="panel"><h3>Last 14 days</h3>${chart}</div>
  <div class="cols2" style="margin-top:16px"><div class="panel"><h3>Aural accuracy</h3>${AURAL.map(s => bar(s.name, p.sk[s.id])).join("")}
   <p class="muted" style="font-size:.9rem;margin-bottom:0">Mock aural tests: ${[1,2,3,4,5,6,7,8].map(g => { const m = (p.mocks||{})[g]; return `Gr ${g}: ${m ? Math.round(m.best*100)+"% best ("+m.n+")" : "not tried"}`; }).join(" · ")}</p></div>
  <div class="panel"><h3>Theory accuracy</h3>${THEORY_TOPICS.map(tp => bar(tp, topicAcc(p, tp))).join("")}
   <p class="muted" style="font-size:.9rem;margin-bottom:0">Lessons starred: ${[1,2,3,4,5,6,7,8].map(g => { const ls = LESSONS.filter(l=>l.g===g); return `Gr ${g}: ${ls.filter(l => (p.tl[l.id]||{}).stars).length}/${ls.length}`; }).join(" · ")}</p></div></div>
  <div class="panel" style="margin-top:16px"><h3>Badges <span class="muted" style="font-size:.9rem;font-weight:400">${Object.keys(p.badges).length} of ${BADGES.length}</span></h3><div class="badges">${BADGES.map(b => `<div class="badge ${p.badges[b.id]?"got":""}">${badgeSVG(b.id, !!p.badges[b.id])}<b>${esc(b.n)}</b><small>${esc(b.d)}</small></div>`).join("")}</div></div>
  <div class="panel" style="margin-top:16px"><h3>Player settings</h3>
   <div class="field"><label for="pname" style="min-width:110px">Name</label><input type="text" id="pname" value="${esc(p.name)}" maxlength="24"></div>
   <div class="field"><label for="pinst" style="min-width:110px">Instruments</label><input type="text" id="pinst" value="${esc(p.inst.join(", "))}" maxlength="60"></div>
   <div class="field"><span style="min-width:110px">Sight-singing clef</span><button class="gbtn" data-act="clef" data-arg="treble" aria-pressed="${p.clef==="treble"}">Treble</button><button class="gbtn" data-act="clef" data-arg="bass" aria-pressed="${p.clef==="bass"}">Bass</button></div>
   <div class="field"><span style="min-width:110px">Theory starts at</span>${[1,2,3,4,5,6,7,8].map(g => `<button class="gbtn" data-act="tstart" data-arg="${g}" aria-pressed="${p.theoryStart===g}">Gr ${g}</button>`).join("")}</div>
   <div class="field"><span style="min-width:110px">Levels</span><button class="gbtn" data-act="unlockAll" aria-pressed="${!!p.unlockAll}">${p.unlockAll?"All levels unlocked":"Unlock every level (parent)"}</button></div>
   <div class="row" style="margin-top:10px"><button class="btn small" data-act="saveSettings">Save settings</button><button class="btn small ghost" data-act="resetPlayer">Reset ${esc(p.name)}’s progress</button>${STATE.players.length>1?`<button class="btn small ghost" data-act="removePlayer">Remove player</button>`:""}</div></div>`;
}
function badgeSVG(id, got){ const c = got ? "var(--brass-strong)" : "var(--line)"; const h = [...id].reduce((a,ch) => a + ch.charCodeAt(0), 0);
  const glyph = h % 3 === 0 ? `<ellipse cx="20" cy="27" rx="6" ry="4.4" transform="rotate(-20 20 27)" fill="${c}"/><line x1="25.6" y1="26" x2="25.6" y2="10" stroke="${c}" stroke-width="2"/>` : h % 3 === 1 ? `<path d="M10 20 C 10 9, 30 9, 30 20 L 30 28 M10 20 L 10 28" stroke="${c}" stroke-width="3" fill="none"/><rect x="7" y="24" width="7" height="9" rx="2" fill="${c}"/><rect x="26" y="24" width="7" height="9" rx="2" fill="${c}"/>` : `<path d="M20 7 L23.5 16 L33 16.5 L25.5 22.5 L28 32 L20 26.5 L12 32 L14.5 22.5 L7 16.5 L16.5 16 Z" fill="${c}"/>`;
  return `<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="${c}" stroke-width="2"/>${glyph}</svg>`; }

/* ===================== events ===================== */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  const gap = e.target.closest(".gap");
  if (gap && VIEW.round && VIEW.round.q && VIEW.round.q.type === "barlines" && !VIEW.round.answered){ const i = +gap.dataset.gap; const s = VIEW.round.sel; s.has(i) ? s.delete(i) : s.add(i); $("#barsvg").innerHTML = rhythmSVG(VIEW.round.q.events, {time:VIEW.round.q.sig, prop:true, gaps:true, barsAt:s, endBar:true}); return; }
  if (!b) return; const act = b.dataset.act, arg = b.dataset.arg; const p = P();
  switch(act){
    case "tab": setTab(arg); break;
    case "player": stopAll(); micClose(); STATE.cur = +arg; VIEW.round = null; VIEW.flash = null; VIEW.edit = false; VIEW.grade = null; save(); render(); break;
    case "addPlayer": modal("Add a player", `<div class="field"><input type="text" id="newName" placeholder="Name" maxlength="24" aria-label="Name"></div><div class="field"><input type="text" id="newInst" placeholder="Instruments, e.g. piano, violin" maxlength="60" aria-label="Instruments"></div>`,
      [["Cancel","ghost"],["Add","primary",() => { const n = ($("#newName").value||"").trim(); if (!n){ $("#newName").focus(); return false; } const inst = ($("#newInst").value||"").split(",").map(s=>s.trim()).filter(Boolean); STATE.players.push(mkPlayer(n, {inst: inst.length?inst:["your instrument"]})); STATE.cur = STATE.players.length-1; VIEW.round = null; save(); render(); }]]); break;
    case "home": stopAll(); VIEW.skill = null; VIEW.mock = null; VIEW.gctx = null; VIEW.round = null; render(); break;
    case "agrade": stopAll(); p.auralGrade = +arg; VIEW.round = null; VIEW.gctx = null; save(); render(); break;
    case "gtest": startGradeTest(arg, "test"); break;
    case "learn": { stopAll(); const [lid, from] = arg.split("|"); VIEW.learn = {id:lid, from: from || null}; VIEW.round = null; render(); window.scrollTo({top:0}); break; }
    case "learnBack": stopAll(); VIEW.learn = null; render(); window.scrollTo({top:0}); break;
    case "demo": audioInit(); if (LEARN_DEMOS[+arg]) LEARN_DEMOS[+arg](); break;
    case "gextra": startGradeTest(arg, "extra"); break;
    case "gback": stopAll(); micClose(); VIEW.round = null; VIEW.gctx = null; render(); window.scrollTo({top:0}); break;
    case "mock": stopAll(); VIEW.mock = +arg; VIEW.skill = null; VIEW.round = null; render(); window.scrollTo({top:0}); break;
    case "mockHome": stopAll(); VIEW.mock = null; VIEW.round = null; render(); window.scrollTo({top:0}); break;
    case "startMock": startRound("mock", VIEW.mock, 1); break;
    case "course": stopAll(); VIEW.course = arg; VIEW.round = null; render(); window.scrollTo({top:0}); sizeCourse(); break;
    case "skill": VIEW.gctx = null; VIEW.learn = null; VIEW.skill = arg; VIEW.round = null; VIEW.level = topLevel(p, arg); render(); window.scrollTo({top:0}); break;
    case "level": VIEW.level = +arg; render(); break;
    case "startAural": startRound("aural", VIEW.skill, VIEW.level); break;
    case "backSkill": VIEW.round = null; render(); break;
    case "again": { const R = VIEW.round; startRound(R.src, R.id, R.level); break; }
    case "nextLevel": { const R = VIEW.round; VIEW.level = R.level+1; startRound("aural", R.id, R.level+1); break; }
    case "sing": singStart(); break;
    case "singStop": if (MIC.finish) MIC.finish("stop"); break;
    case "quit": micClose(); if (VIEW.round && VIEW.round.src === "gym" && VIEW.round.res.length){ endRound(); } else { stopAll(); VIEW.round = null; render(); } break;
    case "play": audioInit(); doPlay(); break;
    case "extra": { audioInit(); const q = VIEW.round && VIEW.round.q; if (q && q.extra[+arg]) q.extra[+arg].fn(); break; }
    case "ans": answerMC(arg); break;
    case "self": if (!VIEW.round.answered){ $$("#ex .selfmark .opt").forEach(x => { x.disabled = true; if (x === b) x.classList.add(+arg>=1?"right":+arg>0?"right":"wrong"); }); showFeedback(+arg, VIEW.round.q.explain); } break;
    case "next": stopAll(); if (MIC.finish){ const f = MIC.finish; MIC.finish = null; clearInterval(MIC.timer); MIC.timer = 0; MIC.on = false; } VIEW.round.i++; nextQ(); break;
    case "clapReset": VIEW.round.taps = []; VIEW.round.clapState = "tap"; $("#tapcount").textContent = "0 taps"; { const pad = $("#pad"); pad.disabled = false; pad.textContent = "Your turn — tap the rhythm here"; } break;
    case "clapDone": if (VIEW.round.taps.length) scoreClap(); else toast("Tap the rhythm on the pad first."); break;
    case "featCheck": checkFeat(); break;
    case "barClear": VIEW.round.sel = new Set(); $("#barsvg").innerHTML = rhythmSVG(VIEW.round.q.events, {time:VIEW.round.q.sig, prop:true, gaps:true, barsAt:VIEW.round.sel, endBar:true}); break;
    case "barCheck": checkBars(); break;
    case "grade": VIEW.grade = +arg; render(); break;
    case "lesson": VIEW.lesson = arg; VIEW.round = null; VIEW.flash = null; render(); window.scrollTo({top:0}); break;
    case "theoryHome": stopAll(); VIEW.course = null; VIEW.lesson = null; VIEW.round = null; VIEW.flash = null; VIEW.gloss = ""; render(); break;
    case "startLesson": startRound("theory", VIEW.lesson, 1); break;
    case "gloss": VIEW.gloss = "open"; render(); break;
    case "glossG": VIEW.glossG = +arg; render(); break;
    case "flash": { const l = LESSON_BY[VIEW.lesson]; const ts = TERMS.filter(t => t[2] === l.p.g); const deck = shuffle(ts).sort((a,b) => (p.flash[a[0]]||0) - (p.flash[b[0]]||0)).slice(0, 15); VIEW.flash = {deck, i:0, flip:false, known:0}; render(); setTimeout(() => { const c = $(".card3"); c && c.scrollIntoView({block:"center", behavior: reducedMotion()?"auto":"smooth"}); }, 30); break; }
    case "flip": VIEW.flash.flip = !VIEW.flash.flip; $(".card3").classList.toggle("flip", VIEW.flash.flip); break;
    case "fknow": { const F = VIEW.flash; const t = F.deck[F.i]; if (+arg){ F.known++; p.flash[t[0]] = (p.flash[t[0]]||0) + 1; } else p.flash[t[0]] = 0; F.i++; F.flip = false; if (F.i >= F.deck.length){ const d = p.days[todayStr()] || (p.days[todayStr()] = {q:0,c:0}); d.q += Math.ceil(F.deck.length/3); p.xp += F.known; checkBadges(p); save(); renderPlayers(); } else save(); render(); setTimeout(() => { const c = $(".card3") || $(".flash"); c && c.focus && c.focus({preventScroll:true}); }, 20); break; }
    case "gymStart": case "gymAgain": VIEW.tab = "gym"; startRound("gym", "gym", 1); break;
    case "awayDone": p.away++; checkBadges(p); save(); b.disabled = true; b.textContent = "Brilliant — well done!"; toast("Real practice beats screen time. Proud of you!"); confetti(); break;
    case "clef": p.clef = arg; save(); render(); break;
    case "tstart": p.theoryStart = +arg; VIEW.grade = null; save(); render(); break;
    case "unlockAll": if (p.unlockAll){ p.unlockAll = false; save(); render(); } else modal("Unlock every level?", `<p>This opens all aural levels and theory grades for ${esc(p.name)}. Good for revision or skipping ahead.</p>`, [["Cancel","ghost"],["Unlock","primary",() => { p.unlockAll = true; save(); render(); }]]); break;
    case "saveSettings": { const n = ($("#pname").value||"").trim(); if (n) p.name = n; const inst = ($("#pinst").value||"").split(",").map(s=>s.trim()).filter(Boolean); if (inst.length) p.inst = inst; save(); render(); toast("Saved."); break; }
    case "resetPlayer": modal(`Reset ${p.name}?`, `<p>This clears all of ${esc(p.name)}’s stars, accuracy, streak and badges on this device and in sync. It can’t be undone.</p>`, [["Keep progress","ghost"],["Reset","primary",() => { const keep = {id:p.id, name:p.name, inst:p.inst, clef:p.clef, theoryStart:p.theoryStart, auralStart:p.auralStart}; STATE.players[STATE.cur] = mkPlayer(p.name, keep); save(); render(); toast("Progress reset."); }]]); break;
    case "removePlayer": modal(`Remove ${p.name}?`, `<p>${esc(p.name)} and their progress will be removed.</p>`, [["Cancel","ghost"],["Remove","primary",() => { STATE.players.splice(STATE.cur,1); STATE.cur = 0; save(); render(); }]]); break;
  }
});
document.addEventListener("input", e => { if (e.target.id === "glossQ"){ VIEW.glossQ = e.target.value; const q = VIEW.glossQ.toLowerCase(), g = VIEW.glossG; $("#glossList").innerHTML = glossItems(TERMS.filter(t => (!g || t[2]===g) && (!q || t[0].toLowerCase().includes(q) || t[1].toLowerCase().includes(q)))); } });
function padTap(){ const R = VIEW.round; if (!R || !R.q || R.q.type !== "clap" || R.clapState !== "tap" || R.answered) return;
  R.taps.push(performance.now()); audioInit(); if (AU.ctx) click(AU.ctx.currentTime + 0.005, false, .6);
  const pad = $("#pad"); pad.classList.add("hit"); setTimeout(() => pad.classList.remove("hit"), 90);
  $("#tapcount").textContent = R.taps.length + " tap" + (R.taps.length===1?"":"s");
  clearTimeout(padTap.t); const enough = R.taps.length >= R.q.onsets.length;
  padTap.t = setTimeout(() => { if (VIEW.round === R && !R.answered) scoreClap(); }, enough ? 900 : 3000); }
document.addEventListener("pointerdown", e => { if (e.target.closest("#pad")){ e.preventDefault(); padTap(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modal").classList.contains("show")) closeModal();
  if ((e.key === " " || e.code === "Space") && VIEW.round && VIEW.round.q && VIEW.round.q.type === "clap" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); padTap(); }
  if ((e.key === "Enter" || e.key === " ") && document.activeElement && document.activeElement.classList.contains("card3")){ e.preventDefault(); document.activeElement.click(); }
});
setInterval(() => { const R = VIEW.round; if (R && R.src === "gym" && !R.done){ const el = $("#gtimer"); if (el) el.textContent = fmtTime(R.endAt - Date.now()); if (Date.now() >= R.endAt && R.answered === false && !R.timeUp){ R.timeUp = true; toast("Time’s up — finish this one!"); } } }, 500);
$$(".tab").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
$("#themeBtn").addEventListener("click", () => { const root = document.documentElement; const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; root.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem(KEY+"-theme", root.dataset.theme); } catch(e){} });
try { const th = localStorage.getItem(KEY+"-theme"); if (th) document.documentElement.dataset.theme = th; } catch(e){}
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

loadLocal(); fixState(); render(); syncInit();
</script>
