<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Classes · The Theory Room</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="site.css">
<style>
  /* Layout: classes as a row of tabs with their join code, then one roster table for the chosen class. */
  main { padding-block: 10px 60px; }
  main > .wrap { display: grid; gap: 28px; }
  .classes { display: flex; flex-wrap: wrap; gap: 8px; }
  .cls { font: inherit; text-align: left; display: grid; gap: 2px; padding: 10px 16px; min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; }
  .cls[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .cls small { color: var(--muted); font-size: 13px; }
  .codebox { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 18px; border: 1px dashed var(--line); border-radius: var(--radius); }
  .code { font-family: var(--f-mono); font-size: 30px; letter-spacing: .14em; font-weight: 500; user-select: all; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--sheet); }
  table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 15px; }
  th { text-align: left; font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td .sub { display: block; color: var(--muted); font-size: 13.5px; }
  td:nth-child(4), td:nth-child(5) { min-width: 180px; }
  .num { font-variant-numeric: tabular-nums; }
  .chip { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
  .chip.ok { background: var(--accent-soft); color: var(--accent); }
  .chip.nudge { border: 1px solid var(--warn); color: var(--warn); }
  .chip.none { border: 1px solid var(--line); color: var(--muted); }
  .newclass { display: flex; flex-wrap: wrap; gap: 8px; }
  .newclass input { flex: 1 1 220px; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .summary div { border-top: 2px solid var(--line); padding-top: 8px; }
  .summary b { display: block; font-family: var(--f-display); font-size: 30px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header class="wrap top">
  <a class="logo" href="./" aria-label="The Theory Room, home">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="var(--accent)"/><g stroke="var(--page)" stroke-width="1.2" opacity=".6"><line x1="6" y1="11" x2="28" y2="11"/><line x1="6" y1="15" x2="28" y2="15"/><line x1="6" y1="19" x2="28" y2="19"/><line x1="6" y1="23" x2="28" y2="23"/></g><ellipse cx="13" cy="21" rx="3.6" ry="2.6" fill="var(--page)" transform="rotate(-20 13 21)"/><ellipse cx="21" cy="13" rx="3.6" ry="2.6" fill="var(--page)" transform="rotate(-20 21 13)"/></svg>
    The Theory Room
  </a>
  <nav aria-label="Main"><a href="app.html">My rooms</a><a href="./">Home</a></nav>
</header>
<main><div class="wrap" id="app"><p class="muted">Opening your classes…</p></div></main>
<footer class="site"><div class="wrap"><p>Students' families choose to join your class with its code, and can leave at any time. You see each student's first name or nickname and their theory and aural progress, nothing else.</p></div></footer>

<script src="config.js"></script>
<script src="tr.js"></script>
<script>
(function () {
  "use strict";
  var esc = TR.esc, app = document.getElementById("app");
  var classes = [], current = null, roster = [], msg = "";

  /* ---------- reading a student's progress ---------- */
  var DAY = 864e5;
  function ago(d) {
    if (!d) return "Not yet";
    var n = Math.floor((Date.now() - new Date(d + (d.length === 10 ? "T12:00:00" : "")).getTime()) / DAY);
    return n <= 0 ? "Today" : n === 1 ? "Yesterday" : n + " days ago";
  }
  function summarise(rows) {
    var out = { last: null, week: 0, aural: null, course: [], drills: 0 };
    var weekAgo = new Date(Date.now() - 7 * DAY).toISOString().slice(0, 10);
    function seen(d) { if (d && (!out.last || d > out.last)) out.last = d; }
    (rows || []).forEach(function (r) {
      var d = r.data || {};
      if (/^data\/users\/.+\/state$/.test(r.path)) {
        var st; try { st = JSON.parse(d.j || "{}"); } catch (e) { st = {}; }
        var p = (st.players || [])[0]; if (!p) return;
        Object.keys(p.days || {}).forEach(function (k) { seen(k); if (k >= weekAgo) out.week += (p.days[k].q || 0); });
        var starred = 0; Object.keys(p.sk || {}).forEach(function (id) { var lv = p.sk[id].lv || {}; Object.keys(lv).forEach(function (L) { if (lv[L] >= 1) starred++; }); });
        out.drills = Object.keys(p.tl || {}).filter(function (k) { return (p.tl[k].stars || 0) >= 1; }).length;
        var mk = p.mocks || {}, gs = Object.keys(mk).map(Number).sort(function (a, b) { return b - a; });
        out.aural = { grade: p.auralGrade || null, starred: starred, mock: gs.length ? { g: gs[0], best: mk[gs[0]].best, n: mk[gs[0]].n } : null };
      }
      var m = /^progress\/(g1-5|g6)$/.exec(r.path);
      if (m) {
        Object.keys(d.days || {}).forEach(function (k) { seen(k); if (k >= weekAgo) out.week += (d.days[k][0] || 0); });
        var mocks = d.mocks || [], last = mocks[mocks.length - 1];
        out.course.push({ which: m[1] === "g6" ? "Grade 6" : "Grades 1–5", days: Object.keys(d.done || {}).length, mock: last ? last.marks : null, outOf: m[1] === "g6" ? 100 : 75 });
      }
    });
    return out;
  }

  /* ---------- views ---------- */
  function upsell() {
    var url = TR.checkoutUrl("teacher"), P = TR.C.prices || {};
    return '<div class="prose"><p class="kicker">For teachers</p><h1 style="font-size:clamp(32px,5vw,48px)">Your classes</h1>' +
      '<p class="lede">A teacher licence (' + esc(P.teacher || "S$99") + ' a year) gives up to 15 of your students the theory and aural rooms, and shows you how each of them is getting on.</p>' +
      '<div class="row"><a class="btn go" href="' + esc(url && url !== "#preview" ? url : "app.html#plans") + '">Get a teacher licence</a><a class="btn" href="app.html">Back to my rooms</a></div>' +
      (TR.preview ? '<p class="note">Preview: choose “Teacher” in the bar at the top to see the class view.</p>' : "") + "</div>";
  }
  function view() {
    if (!TR.user) return '<div class="prose"><h1>Your classes</h1><p class="lede">Sign in first.</p><a class="btn go" href="app.html?next=%2Fteacher.html">Sign in</a></div>';
    if (!TR.access.teacher) return upsell();
    var c = current, used = classes.length ? classes[0].seats_used : 0, seats = classes.length ? classes[0].seats : (TR.access.seats || 15);
    var head = '<div style="display:grid;gap:10px"><p class="kicker">Teacher licence · ' + used + " of " + seats + ' student places used</p><h1 style="font-size:clamp(32px,5vw,48px)">Your classes</h1></div>';
    var tabs = '<div class="classes" role="group" aria-label="Classes">' + classes.map(function (k) {
      return '<button class="cls" type="button" data-class="' + esc(k.id) + '" aria-pressed="' + (c && c.id === k.id) + '"><b>' + esc(k.name) + "</b><small>" + k.members + " student" + (k.members === 1 ? "" : "s") + "</small></button>";
    }).join("") + "</div>";
    var make = '<form class="newclass" id="newClass"><label class="kicker" for="className" style="flex-basis:100%">New class</label><input type="text" id="className" maxlength="60" placeholder="e.g. Tuesday piano group"><button class="btn small" type="submit">Make class</button></form>' + (msg ? '<p class="msg err" role="status">' + esc(msg) + "</p>" : "");
    if (!c) return head + (classes.length ? tabs : '<p class="lede">Make your first class, then give its code to your students\' families.</p>') + make;

    var sums = roster.map(function (s) { return { s: s, x: summarise(s.progress) }; });
    var active = sums.filter(function (r) { return r.x.week > 0; }).length;
    var quiet = sums.filter(function (r) { return !r.x.last || (Date.now() - new Date(r.x.last + "T12:00:00")) / DAY > 7; }).length;
    var code = '<div class="codebox"><div><span class="kicker">Class code</span><div class="code" id="code">' + esc(c.code) + '</div></div><button class="btn small" type="button" id="copyCode">Copy code</button>' +
      '<p class="muted" style="flex:1 1 260px;font-size:15px">Families sign in, open <b>My rooms</b>, and type this code under <b>Join a teacher\'s class</b>.</p></div>';
    var summary = '<div class="summary"><div><b>' + roster.length + '</b><span class="muted">students</span></div><div><b>' + active + '</b><span class="muted">practised this week</span></div><div><b>' + quiet + '</b><span class="muted">quiet for over a week</span></div></div>';
    var rows = sums.map(function (r) {
      var x = r.x, a = x.aural;
      var status = !x.last ? '<span class="chip none">Not started</span>' : (Date.now() - new Date(x.last + "T12:00:00")) / DAY > 7 ? '<span class="chip nudge">Needs a nudge</span>' : '<span class="chip ok">Practising</span>';
      var auralCell = a ? "Grade " + (a.grade || "–") + '<span class="sub">' + a.starred + " test levels starred" + (a.mock ? " · Grade " + a.mock.g + " mock best " + Math.round(a.mock.best * 100) + "%" : "") + "</span>" : '<span class="sub">Not started</span>';
      var courseCell = x.course.length ? x.course.map(function (k) { return k.which + ": " + k.days + " days done" + '<span class="sub">' + (k.mock != null ? "Last mini mock " + k.mock + "/" + k.outOf : "No mini mock yet") + "</span>"; }).join("") : '<span class="sub">Not started</span>';
      return "<tr><td><b>" + esc(r.s.name) + "</b><span class='sub'>Joined " + esc(ago(String(r.s.joined_at).slice(0, 10)).toLowerCase()) + "</span></td>" +
        "<td>" + status + '<span class="sub">' + esc(ago(x.last)) + "</span></td>" +
        '<td class="num">' + x.week + '<span class="sub">questions</span></td>' +
        "<td>" + auralCell + "</td><td>" + courseCell + '</td><td class="num">' + x.drills + '<span class="sub">lessons starred</span></td>' +
        '<td><button class="btn small" type="button" data-remove="' + esc(r.s.learner_id) + '">' + (r.s._sure ? "Tap again to remove" : "Remove") + "</button></td></tr>";
    }).join("");
    var table = roster.length
      ? '<div class="tablewrap"><table><thead><tr><th>Student</th><th>Last practised</th><th>This week</th><th>Aural</th><th>Guided theory course</th><th>Quick drills</th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div>"
      : '<p class="lede">No students yet. Give families the code above.</p>';
    return head + tabs + '<div style="display:grid;gap:18px"><h2 style="font-size:28px">' + esc(c.name) + "</h2>" + code + (roster.length ? summary : "") + table + "</div>" +
      '<details class="faq"><summary>Make another class</summary>' + make + "</details>";
  }
  function render() { app.innerHTML = view(); }

  async function load(pick) {
    if (!TR.access.teacher) { render(); return; }
    try { classes = await TR.teacherClasses(); } catch (e) { msg = e.message; classes = []; }
    current = classes.filter(function (k) { return k.id === pick; })[0] || current && classes.filter(function (k) { return k.id === current.id; })[0] || classes[0] || null;
    roster = current ? await TR.classRoster(current.id).catch(function (e) { msg = e.message; return []; }) : [];
    render();
  }

  app.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (e.target.id === "newClass") {
      msg = "";
      try { var k = await TR.createClass(document.getElementById("className").value); await load(k.id); } catch (err) { msg = err.message; render(); }
    }
  });
  app.addEventListener("click", async function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.class) { await load(b.dataset.class); return; }
    if (b.id === "copyCode") {
      try { await navigator.clipboard.writeText(current.code); b.textContent = "Copied"; }
      catch (err) { var r = document.createRange(); r.selectNodeContents(document.getElementById("code")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected: copy it now"; }
      return;
    }
    if (b.dataset.remove) {
      var st = roster.filter(function (x) { return x.learner_id === b.dataset.remove; })[0];
      if (!st._sure) { st._sure = true; render(); return; }
      try { await TR.removeFromClass(current.id, st.learner_id); roster = roster.filter(function (x) { return x !== st; }); await load(current.id); } catch (err) { msg = err.message; render(); }
    }
  });
  TR.ready.then(function () { load(); });
})();
</script>
</body>
</html>
