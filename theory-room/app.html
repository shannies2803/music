<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Rooms · The Theory Room</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="site.css">
<style>
  main { padding-block: 10px 60px; }
  main > .wrap { display: grid; gap: 34px; }
  .hello { display: grid; gap: 10px; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); width: fit-content; }
  .status.free { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .learners { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .learner { font: inherit; font-size: 16px; min-height: 44px; padding: 6px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; }
  .learner[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .manage { display: grid; gap: 10px; padding: 14px 16px; border: 1px dashed var(--line); border-radius: var(--radius); }
  .manage form { display: flex; flex-wrap: wrap; gap: 8px; }
  .manage form input { flex: 1 1 200px; }
  .manage form + form { margin-top: 10px; }
  #app .rooms { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
  .buy { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .buy .room { gap: 12px; }
  .packpick { display: flex; flex-wrap: wrap; gap: 6px; }
  .packpick button { font: inherit; font-size: 15px; min-width: 44px; min-height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; }
  .packpick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .signin { max-width: 520px; display: grid; gap: 14px; }
  .signin form { display: flex; flex-wrap: wrap; gap: 10px; }
  .signin input { flex: 1 1 240px; }
  .banner { padding: 12px 16px; border-radius: var(--radius); background: var(--accent-soft); }
  .banner.warn { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
  .homework { display: grid; gap: 12px; }
  .hwcard { border: 1px solid var(--line); border-left: 4px solid var(--brass); border-radius: var(--radius); background: var(--sheet); padding: 14px 16px; display: grid; gap: 8px; }
  .hwcard h3 { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: 20px; }
  .hwcard h3 small { font-family: var(--f-body); font-size: 14px; font-weight: 400; color: var(--muted); }
  .hwcard ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
  .hwcard li.done { color: var(--muted); }
  .hwcard li.done::marker { color: var(--accent); }
</style>
</head>
<body>
<header class="wrap top">
  <a class="logo" href="./" aria-label="The Theory Room, home">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="var(--accent)"/><g stroke="var(--page)" stroke-width="1.2" opacity=".6"><line x1="6" y1="11" x2="28" y2="11"/><line x1="6" y1="15" x2="28" y2="15"/><line x1="6" y1="19" x2="28" y2="19"/><line x1="6" y1="23" x2="28" y2="23"/></g><ellipse cx="13" cy="21" rx="3.6" ry="2.6" fill="var(--page)" transform="rotate(-20 13 21)"/><ellipse cx="21" cy="13" rx="3.6" ry="2.6" fill="var(--page)" transform="rotate(-20 21 13)"/></svg>
    The Theory Room
  </a>
  <nav aria-label="Main"><a href="./">Home</a><a href="#plans">Plans</a><a href="#" id="signout" hidden>Sign out</a></nav>
</header>
<main><div class="wrap" id="app"><p class="muted">Opening your rooms…</p></div></main>
<footer class="site"><div class="wrap"><p>Independent; not affiliated with ABRSM or Trinity College London. <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p></div></footer>

<script src="rooms/catalog.js"></script>
<script src="config.js"></script>
<script src="tr.js"></script>
<script>
(function () {
  "use strict";
  var C = TR.C, P = C.prices || {}, esc = TR.esc;
  var app = document.getElementById("app");
  var q = new URLSearchParams(location.search);
  var packGrade = 5, note = "", manageOpen = false, classOpen = false, hwCache = {};
  /* homework for the learner, ticked from their own progress */
  async function loadHw(lid) {
    hwCache[lid] = { loading: true, list: [], pr: {} };
    try { var list = (await TR.myHomework()).filter(function (h) { return h.learner_id === lid; }); hwCache[lid] = { list: list, pr: TR.readProgress(await TR.progressFor(lid)) }; }
    catch (e) { hwCache[lid] = { list: [], pr: {}, err: e.message }; }
    render();
  }
  function hwHTML(L) {
    if (!TR.classesFor(L.id).length) return "";
    var c = hwCache[L.id];
    if (!c) { setTimeout(function () { loadHw(L.id); }, 0); hwCache[L.id] = { loading: true, list: [], pr: {} }; c = hwCache[L.id]; }
    if (c.loading) return '<p class="muted">Looking for homework…</p>';
    if (c.err) return '<p class="msg err">Homework couldn\'t load: ' + esc(c.err) + "</p>";
    if (!c.list.length) return '<p class="muted">No homework from ' + esc(L.name) + "'s teacher right now.</p>";
    return '<div class="homework"><h2 style="font-size:24px">Homework for ' + esc(L.name) + "</h2>" + c.list.map(function (h) {
      var n = h.items.filter(function (it) { return TR.hw.done(it, c.pr); }).length;
      return '<div class="hwcard"><h3>' + esc(h.title) + "<small>" + esc(h.class_name) + (h.due ? " · due " + esc(h.due) : "") + " · " + n + " of " + h.items.length + " done</small></h3>" +
        (h.note ? '<p class="muted">' + esc(h.note) + "</p>" : "") + "<ol>" + h.items.map(function (it) {
          return TR.hw.done(it, c.pr) ? '<li class="done">✓ ' + esc(TR.hw.label(it)) + "</li>" : '<li><a href="' + esc(TR.hw.link(it, L.id)) + '">' + esc(TR.hw.label(it)) + " →</a></li>";
        }).join("") + "</ol></div>";
    }).join("") + "</div>";
  }
  if (q.get("need") === "plan") note = "That room comes with a plan. Choose one below, or open a room that's free.";
  if (q.get("need") === "login") note = "Sign in to open that room.";
  if (q.get("paid")) note = "Thank you! Your plan opens as soon as the payment is confirmed. This usually takes a few seconds.";

  function lid() { return TR.learner ? "?learner=" + encodeURIComponent(TR.learner.id) : ""; }
  function roomCard(o) {
    var open = o.open, href = open ? o.href : "#plans";
    return '<a class="room" href="' + href + '"' + (o.id ? ' id="' + o.id + '"' : "") + '><span class="door">' + o.door + "</span><h3>" + esc(o.t) + '</h3><p class="muted" style="font-size:15.5px">' + o.d + '</p><span class="state ' + (open ? "open" : "locked") + '">' + (open ? (o.openText || "Open →") : (o.lockText || "Comes with a plan →")) + "</span></a>";
  }

  function signInView() {
    return '<div class="signin"><p class="kicker">Sign in</p><h1 style="font-size:clamp(32px,5vw,48px)">Your practice rooms</h1>' +
      '<p class="lede">Type your email and we\'ll send you a link to sign in. No password to remember. New here? The same link makes your free account.</p>' +
      (note ? '<p class="banner">' + esc(note) + "</p>" : "") +
      '<form id="signinForm"><label for="email" class="kicker" style="flex-basis:100%">Email</label><input type="email" id="email" required autocomplete="email" placeholder="you@example.com"><button class="btn go" type="submit">Email me a sign-in link</button></form>' +
      '<p class="msg" id="signinMsg" role="status"></p><p class="note">The account belongs to a parent or teacher. Children don\'t need their own email.</p></div>';
  }

  function dashView() {
    var a = TR.access, paid = TR.isPaid(), L = TR.learner;
    var learners = TR.learners.map(function (l) { return '<button class="learner" data-learner="' + esc(l.id) + '" aria-pressed="' + (L && l.id === L.id) + '">' + esc(l.name) + "</button>"; }).join("");
    var canAdd = TR.learners.length < (C.maxLearners || 3);
    var inClass = L && TR.inClass(L.id), allOpen = a.pro || inClass;
    var openAll = allOpen ? (inClass && !a.pro ? "Open: all grades, with your class →" : "Open: all grades →") : "Open: " + (paid ? "Grade 1 and your pack →" : "Grade 1 free →");
    var myClasses = L ? TR.classesFor(L.id) : [];
    var rooms = [
      roomCard({ door: "ROOM 1 · THEORY", t: "Quick theory drills", d: "Short lessons and fresh questions for Grades 1–8.", href: "rooms/aural.html" + lid() + (lid() ? "&" : "?") + "tab=theory", open: true, openText: openAll }),
      roomCard({ door: "ROOM 1 · THEORY", t: "Guided course: Grades 1–5", d: "A day-by-day plan with picture lessons, practice papers, mocks and a page for the grown-up.", href: "rooms/theory-g1-5.html" + lid(), open: TR.can("course-g1-5"), lockText: "Family plan or a Grade 1–5 pack →" }),
      roomCard({ door: "ROOM 1 · THEORY", t: "Guided course: Grade 6", d: "Four-part harmony, figured bass, harmonising melodies, composing and score questions.", href: "rooms/theory-g6.html" + lid(), open: TR.can("course-g6"), lockText: "Family plan or a Grade 6 pack →" }),
      roomCard({ door: "ROOM 1 · THEORY", t: "Guided course: Grade 7", d: "Figures and suspensions, chromatic chords, completing a passage, composing a melody and score questions, in 30 days.", href: "rooms/aural.html" + (lid() ? lid() + "&" : "?") + "tab=theory&course=g7", open: TR.can("course-g7"), lockText: "Family plan or a Grade 7 pack →" }),
      roomCard({ door: "ROOM 1 · THEORY", t: "Guided course: Grade 8", d: "The Baroque trio sonata, Romantic keyboard writing, composition and orchestral scores, in 30 days.", href: "rooms/aural.html" + (lid() ? lid() + "&" : "?") + "tab=theory&course=g8", open: TR.can("course-g8"), lockText: "Family plan or a Grade 8 pack →" }),
      roomCard({ door: "ROOM 2 · AURAL", t: "Aural tests", d: "ABRSM and Trinity aural tests, Initial to Grade 8, with mocks, plus sight-reading marked by the microphone.", href: "rooms/aural.html" + lid(), open: true, openText: openAll }),
      roomCard({ door: "ROOM 3 · REPERTOIRE", t: "Exam pieces, ABRSM and Trinity", d: "Every list for every instrument and voice. Saving and checking programmes comes with the Family plan.", href: "repertoire/", open: true, openText: a.pro ? "Open: everything →" : "Open: browse free →" }),
      roomCard({ door: "ROOM 4 · COMPOSERS", t: "Composer films", d: "One-minute films on Bach, Vivaldi, Haydn, Mozart, Beethoven, Brahms and Grieg, each with a quiz.", href: "rooms/composers.html", open: true, openText: a.pro ? "Open: every film →" : "Open: Beethoven free →" })
    ].join("");
    var price = function (k, d) { return esc(P[k] || d); };
    var buyMonthly = TR.checkoutUrl("monthly"), buyYearly = TR.checkoutUrl("yearly");
    var buyTeacher = TR.checkoutUrl("teacher");
    var teacherCard = a.teacher ? "" : '<div class="room"><span class="door">FOR TEACHERS · A YEAR</span><h3>Teacher licence</h3><p class="muted" style="font-size:15.5px">Up to 15 students get theory and aural, and you see their progress in a class view. ' + price("teacher", "S$99") + ' a year.</p>' +
      '<div class="row"><a class="btn small" data-buy="teacher" href="' + esc(buyTeacher || "#") + '"' + (buyTeacher && buyTeacher !== "#preview" ? ' target="_blank" rel="noopener"' : "") + '>Get a teacher licence</a></div></div>';
    var plans = a.pro
      ? '<p>' + (a.teacher ? "You have a <b>teacher licence</b>: every room for you, and theory and aural for up to " + (a.seats || 15) + " students in your classes." : "You have the <b>Family plan</b>: every room and every grade.") + (C.billingUrl ? ' <a href="' + esc(C.billingUrl) + '" target="_blank" rel="noopener">Change or cancel your plan</a>.' : "") + "</p>" + (a.teacher ? "" : "")
      : '<div class="buy">' +
        '<div class="room" style="background:var(--accent-soft)"><span class="door">FAMILY PLAN</span><h3>Every room, every grade</h3><p class="muted" style="font-size:15.5px">Up to 3 learners. Both guided courses, every aural grade and mock, and saving exam programmes.</p>' +
          '<div class="row"><a class="btn go small" data-buy="monthly" href="' + esc(buyMonthly || "#") + '"' + (buyMonthly && buyMonthly !== "#preview" ? ' target="_blank" rel="noopener"' : "") + ">" + price("monthly", "S$15") + " a month</a>" +
          '<a class="btn small" data-buy="yearly" href="' + esc(buyYearly || "#") + '"' + (buyYearly && buyYearly !== "#preview" ? ' target="_blank" rel="noopener"' : "") + ">" + price("yearly", "S$129") + " a year</a></div></div>" +
        '<div class="room"><span class="door">GRADE PACK · 12 MONTHS</span><h3>One grade, paid once</h3><p class="muted" style="font-size:15.5px">Theory and aural for one grade. Each pack also opens that grade’s guided theory course (Grades 1–5 share one).</p>' +
          '<div class="packpick" role="group" aria-label="Which grade?">' + [1, 2, 3, 4, 5, 6, 7, 8].map(function (g) { return '<button type="button" data-pack="' + g + '" aria-pressed="' + (g === packGrade) + '">' + g + "</button>"; }).join("") + "</div>" +
          '<a class="btn small" id="buyPack" data-buy="pack" href="#">Grade ' + packGrade + " pack · " + price(packGrade <= 5 ? "packLow" : "packHigh", packGrade <= 5 ? "S$49" : "S$69") + "</a></div>" +
        teacherCard + "</div>" + (TR.configured && !C.checkout.monthly ? '<p class="banner warn">Payments aren\'t switched on yet. Add the checkout links in config.js (see SETUP.md).</p>' : "");

    return '<div class="hello"><p class="muted" style="font-size:15px">' + (TR.configured ? "Signed in as " + esc(TR.user.email) : "Preview: not signed in") + "</p>" +
      '<h1 style="font-size:clamp(32px,5vw,48px)">' + (L ? "Practising today: " + esc(L.name) : "Your rooms") + "</h1>" +
      '<span class="status ' + (paid ? "" : "free") + '">' + esc(TR.planLabel()) + "</span>" +
      (note ? '<p class="banner">' + esc(note) + "</p>" : "") +
      (a.teacher ? '<p class="banner"><b>Teacher licence.</b> <a href="teacher.html">Open your classes →</a></p>' : "") + "</div>" +
      (L ? hwHTML(L) : "") +
      '<div style="display:grid;gap:12px"><h2 style="font-size:24px">Who\'s practising?</h2><div class="learners" role="group" aria-label="Learners">' + learners + "</div>" +
      '<details class="manage"' + (manageOpen ? " open" : "") + '><summary style="cursor:pointer;font-weight:700">Add or rename learners</summary>' +
        (canAdd ? '<form id="addForm"><label class="kicker" for="newName" style="flex-basis:100%">New learner (first name or nickname)</label><input type="text" id="newName" maxlength="40" required><button class="btn small" type="submit">Add learner</button></form>' : '<p class="muted">You have ' + TR.learners.length + " learners, the most one plan holds.</p>") +
        (L ? '<form id="renameForm"><label class="kicker" for="rename" style="flex-basis:100%">Rename ' + esc(L.name) + '</label><input type="text" id="rename" maxlength="40" value="' + esc(L.name) + '"><button class="btn small" type="submit">Save name</button>' + (TR.learners.length > 1 ? '<button class="btn small" type="button" id="removeBtn">Remove ' + esc(L.name) + "</button>" : "") + "</form>" : "") +
        '<p class="msg" id="learnMsg" role="status"></p><p class="note">Each learner keeps their own progress. Use a first name or a nickname; we don\'t need anything else about your child.</p></details>' +
      (L ? '<details class="manage"' + (classOpen || myClasses.length ? " open" : "") + '><summary style="cursor:pointer;font-weight:700">' + (myClasses.length ? esc(L.name) + "'s class: " + esc(myClasses.map(function (c) { return c.class_name; }).join(", ")) : "Join a teacher's class") + "</summary>" +
        myClasses.map(function (c) { return '<p class="row" style="gap:8px">' + esc(c.class_name) + (TR.inClass(L.id) ? ' <span class="status">Theory and aural open</span>' : ' <span class="status free">Class licence has ended</span>') + ' <button class="btn small" type="button" data-leave="' + esc(c.class_id) + '">Leave</button></p>'; }).join("") +
        '<form id="joinForm"><label class="kicker" for="classCode" style="flex-basis:100%">Class code from your teacher</label><input type="text" id="classCode" maxlength="12" autocomplete="off" style="text-transform:uppercase"><button class="btn small" type="submit">Join for ' + esc(L.name) + "</button></form>" +
        '<p class="msg" id="joinMsg" role="status"></p><p class="note">Your teacher sees ' + esc(L.name) + "'s name and progress in theory and aural, nothing else. Leave the class at any time.</p></details>" : "") + "</div>" +
      '<div style="display:grid;gap:14px"><h2 style="font-size:24px">Rooms</h2><div class="rooms">' + rooms + "</div></div>" +
      '<div id="plans" style="display:grid;gap:14px;scroll-margin-top:20px"><h2 style="font-size:24px">' + (a.pro ? "Your plan" : "Open more rooms") + "</h2>" + plans + '<p class="msg" id="buyMsg" role="status"></p></div>';
  }

  function render() {
    var signedIn = !!TR.user;
    document.getElementById("signout").hidden = !(TR.configured && signedIn);
    if (TR.configured && !TR.sb) { app.innerHTML = '<p class="banner warn">We couldn\'t reach the sign-in service. Check your connection and reload the page.</p>'; return; }
    app.innerHTML = signedIn ? dashView() : signInView();
    if (location.hash === "#plans" && signedIn) { var el = document.getElementById("plans"); if (el) el.scrollIntoView(); }
  }

  app.addEventListener("toggle", function (e) { if (e.target.classList && e.target.classList.contains("manage")) manageOpen = e.target.open; }, true);
  app.addEventListener("submit", async function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === "signinForm") {
      var msg = document.getElementById("signinMsg"), btn = f.querySelector("button");
      btn.disabled = true; msg.className = "msg"; msg.textContent = "Sending…";
      try { await TR.signIn(document.getElementById("email").value.trim(), q.get("next")); msg.textContent = "Check your email and tap the link to sign in. It can take a minute to arrive."; }
      catch (err) { msg.className = "msg err"; msg.textContent = "That didn't send: " + (err.message || "please try again") + "."; btn.disabled = false; }
    }
    if (f.id === "addForm") { try { await TR.addLearner(document.getElementById("newName").value); } catch (err) { setMsg("learnMsg", err.message); } }
    if (f.id === "joinForm" && TR.learner) {
      classOpen = true;
      hwCache = {};
      try { var nm = await TR.joinClass(document.getElementById("classCode").value, TR.learner.id); var m2 = document.getElementById("joinMsg"); if (m2) { m2.className = "msg"; m2.textContent = "Joined " + nm + "."; } }
      catch (err) { setMsg("joinMsg", err.message); }
    }
    if (f.id === "renameForm" && TR.learner) { try { await TR.renameLearner(TR.learner.id, document.getElementById("rename").value); } catch (err) { setMsg("learnMsg", err.message); } }
  });
  function setMsg(id, t) { var el = document.getElementById(id); if (el) { el.className = "msg err"; el.textContent = t; } }

  app.addEventListener("click", async function (e) {
    var t = e.target.closest("button, a"); if (!t) return;
    if (t.dataset.learner) { TR.setLearner(t.dataset.learner); return; }
    if (t.dataset.leave) { hwCache = {}; try { await TR.leaveClass(t.dataset.leave, TR.learner.id); } catch (err) { setMsg("joinMsg", err.message); } return; }
    if (t.dataset.pack) { packGrade = +t.dataset.pack; render(); var b = document.getElementById("buyPack"); if (b) b.focus(); return; }
    if (t.id === "removeBtn") {
      if (t.dataset.sure !== "1") { t.dataset.sure = "1"; t.textContent = "Tap again to remove " + TR.learner.name + " and their progress"; return; }
      try { await TR.removeLearner(TR.learner.id); } catch (err) { setMsg("learnMsg", err.message); } return;
    }
    if (t.dataset.buy) {
      var url = t.dataset.buy === "pack" ? TR.checkoutUrl(packGrade <= 5 ? "packLow" : "packHigh", packGrade) : TR.checkoutUrl(t.dataset.buy);
      if (url === "#preview") { e.preventDefault(); var m = document.getElementById("buyMsg"); m.className = "msg"; m.textContent = "Preview mode: this button will open the Lemon Squeezy checkout once payments are set up. Use the switch at the top to see the site as a paying family."; return; }
      if (!url) { e.preventDefault(); setMsg("buyMsg", "This plan isn't on sale yet."); return; }
      if (t.dataset.buy === "pack") { e.preventDefault(); window.location.href = url; }
    }
  });
  document.getElementById("signout").addEventListener("click", async function (e) { e.preventDefault(); await TR.signOut(); location.href = "./"; });

  TR.onChange(render);
  TR.ready.then(function () {
    render();
    var next = q.get("next");
    if (TR.user && next && q.get("need") !== "plan" && /^\/(rooms|repertoire)\/[\w.\-\/]*(\?[\w=&%\-]*)?$/.test(next)) location.replace(next);
    if (q.get("paid") && TR.configured) {
      var tries = 0, poll = setInterval(async function () { tries++; await TR.refreshAccess(); if (TR.isPaid() || tries > 10) clearInterval(poll); }, 3000);
    }
  });
})();
</script>
</body>
</html>
